          ctx.fill();
          ctx.restore();
        }

        function drawCreature(c) {
          const L = c.size,
            a = 0.26 + (1 - c.depth) * 0.52;
          ctx.save();
          ctx.translate(c.x, c.y);
          ctx.rotate(c.h);
          ctx.globalAlpha = a * 0.35; // shadow on the riverbed
          ctx.fillStyle = "#04262e";
          ctx.beginPath();
          ctx.ellipse(-L * 0.06, L * 0.13, L * 0.54, L * 0.22, 0, 0, 7);
          ctx.fill();
          ctx.globalAlpha = a;

          if (c.type === "whale") {
            const t = Math.sin(c.wag) * 0.2;
            ctx.fillStyle = c.s.col;
            ctx.beginPath();
            ctx.moveTo(L * 0.5, 0);
            ctx.bezierCurveTo(
              L * 0.3,
              -L * 0.21,
              -L * 0.16,
              -L * 0.2,
              -L * 0.36,
              -L * 0.07,
            );
            ctx.lineTo(-L * 0.36, L * 0.07);
            ctx.bezierCurveTo(
              -L * 0.16,
              L * 0.2,
              L * 0.3,
              L * 0.21,
              L * 0.5,
              0,
            );
            ctx.closePath();
            ctx.fill();
            // flippers
            ctx.save();
            ctx.translate(L * 0.1, 0);
            for (const s of [-1, 1]) {
              ctx.save();
              ctx.rotate(s * (0.85 + Math.sin(c.wag) * 0.06));
              ctx.beginPath();
              ctx.ellipse(0, s * L * 0.12, L * 0.2, L * 0.055, 0, 0, 7);
              ctx.fill();
              ctx.restore();
            }
            ctx.restore();
            // flukes
            ctx.save();
            ctx.translate(-L * 0.36, 0);
            ctx.rotate(t);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.quadraticCurveTo(-L * 0.1, -L * 0.06, -L * 0.24, -L * 0.26);
            ctx.quadraticCurveTo(-L * 0.06, -L * 0.1, -L * 0.02, 0);
            ctx.quadraticCurveTo(-L * 0.06, L * 0.1, -L * 0.24, L * 0.26);
            ctx.quadraticCurveTo(-L * 0.1, L * 0.06, 0, 0);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            // pale mottling along the back
            ctx.globalAlpha = a * 0.28;
            ctx.fillStyle = c.s.tint;
            ctx.beginPath();
            ctx.ellipse(L * 0.16, 0, L * 0.2, L * 0.06, 0, 0, 7);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(-L * 0.1, -L * 0.04, L * 0.11, L * 0.035, 0, 0, 7);
            ctx.fill();
          } else if (c.type === "ray") {
            const f = 1 + Math.sin(c.wag) * 0.16;
            ctx.fillStyle = c.s.col;
            ctx.beginPath();
            ctx.moveTo(L * 0.4, 0);
            ctx.quadraticCurveTo(
              L * 0.05,
              -L * 0.3 * f,
              -L * 0.34,
              -L * 0.52 * f,
            );
            ctx.quadraticCurveTo(-L * 0.2, -L * 0.12, -L * 0.3, 0);
            ctx.quadraticCurveTo(-L * 0.2, L * 0.12, -L * 0.34, L * 0.52 * f);
            ctx.quadraticCurveTo(L * 0.05, L * 0.3 * f, L * 0.4, 0);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = c.s.col;
            ctx.lineWidth = L * 0.045;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(-L * 0.3, 0);
            ctx.quadraticCurveTo(
              -L * 0.6,
              Math.sin(c.wag) * L * 0.1,
              -L * 0.85,
              Math.sin(c.wag) * L * 0.16,
            );
            ctx.stroke();
          } else if (c.type === "shark") {
            const t = Math.sin(c.wag) * 0.34;
            ctx.fillStyle = c.s.col;
            ctx.beginPath();
            ctx.moveTo(L * 0.52, 0);
            ctx.bezierCurveTo(
              L * 0.24,
              -L * 0.17,
              -L * 0.1,
              -L * 0.15,
              -L * 0.34,
              -L * 0.05,
            );
            ctx.lineTo(-L * 0.34, L * 0.05);
            ctx.bezierCurveTo(
              -L * 0.1,
              L * 0.15,
              L * 0.24,
              L * 0.17,
              L * 0.52,
              0,
            );
            ctx.closePath();
            ctx.fill();
            for (const s of [-1, 1]) {
              // pectorals
              ctx.save();
              ctx.translate(L * 0.04, 0);
              ctx.rotate(s * 1.0);
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.lineTo(-L * 0.06, s * L * 0.3);
              ctx.lineTo(L * 0.1, s * L * 0.06);
              ctx.closePath();
              ctx.fill();
              ctx.restore();
            }
            ctx.beginPath(); // dorsal
            ctx.moveTo(L * 0.06, 0);
            ctx.lineTo(-L * 0.1, -L * 0.03);
            ctx.lineTo(-L * 0.04, L * 0.03);
            ctx.closePath();
            ctx.fill();
            ctx.save();
            ctx.translate(-L * 0.34, 0);
            ctx.rotate(t);
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-L * 0.2, -L * 0.3);
            ctx.lineTo(-L * 0.12, 0);
            ctx.lineTo(-L * 0.22, L * 0.2);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
            if (c.jaw > 0.02) {
              // open mouth, with teeth
              const g = c.jaw * L * 0.2;
              ctx.fillStyle = "#3d0c0c";
              ctx.beginPath();
              ctx.moveTo(L * 0.53, 0);
              ctx.quadraticCurveTo(L * 0.3, -g, L * 0.16, -g * 0.75);
              ctx.lineTo(L * 0.16, g * 0.75);
              ctx.quadraticCurveTo(L * 0.3, g, L * 0.53, 0);
              ctx.closePath();
              ctx.fill();
              ctx.fillStyle = "#f2f0ea";
              for (let k = 0; k < 5; k++) {
                const u = 0.2 + k * 0.075,
                  y = g * 0.8 * (1 - k * 0.12);
                ctx.beginPath();
                ctx.moveTo(L * u, -y);
                ctx.lineTo(L * (u + 0.05), -y * 0.35);
                ctx.lineTo(L * (u + 0.01), -y * 0.3);
                ctx.closePath();
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(L * u, y);
                ctx.lineTo(L * (u + 0.05), y * 0.35);
                ctx.lineTo(L * (u + 0.01), y * 0.3);
                ctx.closePath();
                ctx.fill();
              }
            }
          } else {
            // shoal
            for (const f of c.fish) {
              ctx.save();
              ctx.translate(f.ox, f.oy + Math.sin(c.wag + f.ph) * 2);
              drawFish(L * f.sz, c.wag + f.ph, c.s.col);
              ctx.restore();
            }
          }
          ctx.globalAlpha = 1;
          ctx.restore();
        }

        function chomp(b) {
          if (b.eaten > 0) return;
          if (b === me) sfxChomp();
          b.eaten = 1.7;
          b.chomped = 1.7;
          b.eatT = 0;
          b.vx = b.vy = 0;
          b.boost = 0;
          b.offTime = 0;
          if (!REDUCED) {
            for (let i = 0; i < 26; i++) {
              const a = Math.random() * 7,
                r = 8 + Math.random() * 22;
              wake.push({
                x: b.x + Math.cos(a) * r,
                y: b.y + Math.sin(a) * r,
                vx: Math.cos(a) * (50 + Math.random() * 90),
                vy: Math.sin(a) * (50 + Math.random() * 90),
                r: 3 + Math.random() * 6,
                life: 0,
                max: 0.7 + Math.random() * 0.6,
                col: i % 5 === 0 ? "#e8402a" : "#eaf7f4",
              });
            }
          }
          if (b.hunter) {
            // it has hold of you now
            const c = b.hunter;
            c.hunt = null;
            c.feed = 1.35;
            c.jaw = 1;
            c.thrash = 0;
            c.x = b.x;
            c.y = b.y;
            c.h = Math.atan2(
              b.y - c.y || Math.sin(c.h),
              b.x - c.x || Math.cos(c.h),
            );
            b.hunter = null;
          }
        }

        function respawn(b) {
          const p = track.pts[b.idx],
            t = track.tan[b.idx];
          b.x = p.x;
          b.y = p.y;
          b.h = Math.atan2(t.y, t.x);
          b.vx = b.vy = 0;
          b.offTime = 0;
          b.bump = 0.5;
        }

        /* ============================================================
   BOOST PICKUPS — surges of current sitting off the ideal line,
   so taking one always costs you a little cornering.
   ============================================================ */
        let boosts = [];

        function spawnBoosts() {
          boosts = [];
          const step = Math.max(6, Math.round(560 / track.spacing));
          const CLEAR = 60; // keep boosts clear of any boat's grid slot
          let k = 0;
          for (
            let i = Math.round(360 / track.spacing);
            i < track.n - 4;
            i += step
          ) {
            const lane = [-0.46, 0.46, 0, 0.46, -0.46][k % 5];
            const p = track.pts[i],
              nv = track.nrm[i];
            const x = p.x + nv.x * lane * track.half,
              y = p.y + nv.y * lane * track.half;
            let onGrid = false;
            for (const b of boats) {
              if ((b.x - x) ** 2 + (b.y - y) ** 2 < CLEAR * CLEAR) {
                onGrid = true;
                break;
              }
            }
            if (onGrid) {
              k++;
              continue;
            }
            boosts.push({ x, y, i, lane, cool: 0, spin: Math.random() * 7 });
            k++;
          }
        }

        function drawBoosts() {
          for (const bo of boosts) {
            if (bo.cool > 0) {
              // spent: a faint ghost while it recharges
              ctx.globalAlpha = 0.13;
              ctx.strokeStyle = "#ffd84a";
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.arc(bo.x, bo.y, 13, 0, 7);
              ctx.stroke();
              ctx.globalAlpha = 1;
              continue;
            }
            const pu = 1 + Math.sin(waveT * 4 + bo.spin) * 0.1;
            ctx.save();
            ctx.translate(bo.x, bo.y);
            ctx.globalAlpha = 0.22;
            ctx.fillStyle = "#ffd84a";
            ctx.beginPath();
            ctx.arc(0, 0, 17 * pu, 0, 7);
            ctx.fill();
            ctx.globalAlpha = 0.9;
            ctx.rotate(track.tanAngle[bo.i]);
            ctx.strokeStyle = "#ffd84a";
            ctx.lineWidth = 3;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            for (let c = 0; c < 2; c++) {
              // two chevrons pointing downstream
              const o = -4 + c * 8;
              ctx.beginPath();
              ctx.moveTo(o - 5, -7);
              ctx.lineTo(o + 4, 0);
              ctx.lineTo(o - 5, 7);
              ctx.stroke();
            }
            ctx.restore();
            ctx.globalAlpha = 1;
          }
        }

        /* ============================================================
   THE HARBOUR FLEET — Monaco only. Superyachts moored in the basin
   inside the circuit, with people out on deck watching the racing.
   ============================================================ */
        const MOORED = [];
        const SKIN = ["#f0d3b5", "#e8c39e", "#c98a5e", "#8d5a3b", "#5d3a26"];
        const SWIM = [
          "#ff4d6d",
          "#ffd84a",
          "#39c0ff",
          "#f5f2ec",
          "#ff8a3d",
          "#2fcb7b",
          "#c86bff",
        ];

        // ray-cast against the centreline loop
        function insideTrack(x, y) {
          let inside = false;
          for (let i = 0, j = track.n - 1; i < track.n; j = i++) {
            const a = track.pts[i],
              b = track.pts[j];
            if (
              a.y > y !== b.y > y &&
              x < ((b.x - a.x) * (y - a.y)) / (b.y - a.y) + a.x
            )
              inside = !inside;
          }
          return inside;
        }

        function spawnMoored() {
          MOORED.length = 0;
          if (!track.harbour) return;
          const bd = track.bounds;

          // Collect every patch of harbour water that's inside the circuit and clear
          // of the racing line, then pack yachts into it. Rejection sampling kept
          // running out of attempts and leaving the basin half empty.
          const slots = [];
          for (let x = bd.minx; x < bd.maxx; x += 34) {
            for (let y = bd.miny; y < bd.maxy; y += 34) {
              if (!insideTrack(x, y)) continue;
              if (channelDist(x, y).d < track.half + 85) continue;
              slots.push({ x, y });
            }
          }
          for (let i = slots.length - 1; i > 0; i--) {
            // shuffle
            const j = (Math.random() * (i + 1)) | 0;
            [slots[i], slots[j]] = [slots[j], slots[i]];
          }

          for (const sl of slots) {
            if (MOORED.length >= 16) break;
            const L = 58 + Math.random() * 78;
            let clash = false;
            for (const m of MOORED) {
              const need = (m.L + L) * 0.42 + 34;
              if ((m.x - sl.x) ** 2 + (m.y - sl.y) ** 2 < need * need) {
                clash = true;
                break;
              }
            }
            if (clash) continue;
            const ci = channelDist(sl.x, sl.y);
            if (ci.d < track.half + L * 0.42 + 26) continue; // whole hull clear of the river

            const m = {
              x: sl.x,
              y: sl.y,
              L,
              W: L * 0.27,
              h: track.tanAngle[ci.i] + (Math.random() - 0.5) * 0.5, // lying along the quay
              bob: Math.random() * 7,
              cheer: 0,
              pool: L > 105,
              deck: [],
              brollies: [],
            };
            const n = 3 + Math.floor(Math.random() * 5);
            for (let i = 0; i < n; i++) {
              m.deck.push({
                u: -0.28 + Math.random() * 0.62, // along the hull
                v: (Math.random() * 2 - 1) * 0.3, // across it
                lying: Math.random() < 0.55,
                skin: SKIN[(Math.random() * SKIN.length) | 0],
                swim: SWIM[(Math.random() * SWIM.length) | 0],
                ph: Math.random() * 7,
                towel: SWIM[(Math.random() * SWIM.length) | 0],
              });
            }
            for (let i = 0; i < (L > 90 ? 2 : 1); i++)
              m.brollies.push({
                u: -0.34 + Math.random() * 0.2,
                v: (Math.random() * 2 - 1) * 0.26,
                col: SWIM[(Math.random() * SWIM.length) | 0],
              });
            MOORED.push(m);
          }
        }

        function stepMoored(dt) {
          for (const m of MOORED) {
            m.bob += dt * 0.9;
            let near = false;
            for (const b of boats) {
              if ((b.x - m.x) ** 2 + (b.y - m.y) ** 2 < 300 * 300) {
                near = true;
                break;
              }
            }
            m.cheer = near
              ? Math.min(1, m.cheer + dt * 4)
              : Math.max(0, m.cheer - dt * 1.6);
          }
        }

        function drawPerson(p, sc, cheer, t) {
          const wave = cheer * (0.5 + 0.5 * Math.sin(t * 7 + p.ph));
          ctx.save();
          ctx.scale(sc, sc);
          if (p.lying) {
            ctx.fillStyle = p.towel;
            ctx.globalAlpha = 0.9;
            ctx.beginPath();
            ctx.roundRect(-4.6, -2.6, 9.2, 5.2, 1.4);
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.fillStyle = p.skin;
            ctx.beginPath();
            ctx.ellipse(0, 0, 3.1, 1.15, 0, 0, 7);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(3.3, 0, 1.25, 0, 7);
            ctx.fill();
            ctx.fillStyle = p.swim;
            ctx.fillRect(-1.5, -1.15, 1.5, 2.3);
            ctx.fillRect(1.1, -1.05, 0.9, 2.1);
          } else {
            ctx.fillStyle = p.skin;
            ctx.beginPath();
            ctx.ellipse(0, 0, 1.5, 1.3, 0, 0, 7);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(0, 0, 1.7, 0, 7);
            ctx.fill();
            ctx.fillStyle = p.swim;
            ctx.beginPath();
            ctx.ellipse(0, 0, 1.45, 1.25, 0, 0, 7);
            ctx.fill();
            ctx.fillStyle = p.skin;
            ctx.beginPath();
            ctx.arc(0, 0, 1.15, 0, 7);
            ctx.fill();
            if (cheer > 0.02) {
              // arms up, waving
              ctx.strokeStyle = p.skin;
              ctx.lineWidth = 0.75;
              ctx.lineCap = "round";
              for (const s of [-1, 1]) {
                ctx.beginPath();
                ctx.moveTo(0, s * 1.1);
                ctx.lineTo(1.4 + wave * 0.7, s * (2.3 + wave * 0.9));
                ctx.stroke();
              }
            }
          }
          ctx.restore();
        }

        function drawYacht(m) {
          const L = m.L,
            W = m.W,
            t = waveT;
          ctx.save();
          ctx.translate(
            m.x + Math.sin(m.bob) * 1.2,
            m.y + Math.cos(m.bob * 0.8) * 1.2,
          );
          ctx.rotate(m.h + Math.sin(m.bob * 0.7) * 0.012);

          ctx.fillStyle = "rgba(3,26,34,.34)"; // shadow in the water
          ctx.beginPath();
          ctx.ellipse(2, 3, L * 0.52, W * 0.62, 0, 0, 7);
          ctx.fill();

          ctx.beginPath(); // hull
          ctx.moveTo(L * 0.5, 0);
          ctx.quadraticCurveTo(L * 0.3, -W * 0.52, -L * 0.1, -W * 0.5);
          ctx.lineTo(-L * 0.5, -W * 0.42);
          ctx.lineTo(-L * 0.5, W * 0.42);
          ctx.lineTo(-L * 0.1, W * 0.5);
          ctx.quadraticCurveTo(L * 0.3, W * 0.52, L * 0.5, 0);
          ctx.closePath();
          ctx.fillStyle = "#f4f2ec";
          ctx.fill();
          ctx.strokeStyle = "rgba(4,20,28,.32)";
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.fillStyle = "#c9a06a"; // teak aft deck
          ctx.beginPath();
          ctx.roundRect(-L * 0.48, -W * 0.38, L * 0.5, W * 0.76, 2);
          ctx.fill();

          if (m.pool) {
            ctx.fillStyle = "#39c0ff";
            ctx.beginPath();
            ctx.roundRect(-L * 0.44, -W * 0.16, L * 0.13, W * 0.32, 2);
            ctx.fill();
          }

          ctx.fillStyle = "#fbfaf6"; // superstructure
          ctx.beginPath();
          ctx.roundRect(-L * 0.02, -W * 0.4, L * 0.34, W * 0.8, 3);
          ctx.fill();
          ctx.fillStyle = "rgba(10,40,52,.62)";
          ctx.beginPath();
          ctx.roundRect(L * 0.06, -W * 0.32, L * 0.16, W * 0.64, 2);
          ctx.fill();
          ctx.fillStyle = "#e6e2d8";
          ctx.beginPath();
          ctx.roundRect(L * 0.3, -W * 0.2, L * 0.12, W * 0.4, 2);
          ctx.fill();
          ctx.fillStyle = "rgba(4,20,28,.5)";
          ctx.beginPath();
          ctx.arc(L * 0.2, 0, 1.6, 0, 7);
          ctx.fill();

          for (const u of m.brollies) {
            // parasols
            ctx.save();
            ctx.translate(u.u * L, u.v * W);
            ctx.fillStyle = "rgba(3,26,34,.22)";
            ctx.beginPath();
            ctx.arc(1.5, 1.8, W * 0.17, 0, 7);
            ctx.fill();
            ctx.fillStyle = u.col;
            ctx.globalAlpha = 0.95;
            ctx.beginPath();
            ctx.arc(0, 0, W * 0.17, 0, 7);
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.restore();
          }

          const sc = Math.max(0.9, W * 0.075);
          for (const p of m.deck) {
            ctx.save();
            ctx.translate(p.u * L, p.v * W);
            if (!p.lying) ctx.rotate(-m.h); // standing folk face the racing
            drawPerson(p, sc, m.cheer, t);
            ctx.restore();
          }
          ctx.restore();
        }

        /* wake + spray particles */
        function spray(x, y, col, sc) {
          wake.push({
            x,
            y,
            vx: (Math.random() - 0.5) * 40,
            vy: (Math.random() - 0.5) * 40,
            r: 2 + Math.random() * 3 * sc,
            life: 0,
            max: 0.5 + Math.random() * 0.4,
            col,
          });
        }
        function emitWake(b, dt) {
          const spd = Math.hypot(b.vx, b.vy);
          if (spd < 18) return;
          const rate = spd / 26 + b.drift / 40;
          b.spawnT += dt * rate * 10;
          while (b.spawnT > 1) {
            b.spawnT--;
            const sx = b.x - Math.cos(b.h) * 15,
              sy = b.y - Math.sin(b.h) * 15;
            const side =
              (Math.random() < 0.5 ? -1 : 1) * (4 + Math.random() * 7);
            wake.push({
              x: sx - Math.sin(b.h) * -side,
              y: sy + Math.cos(b.h) * -side,
              vx:
                -Math.cos(b.h) * 18 +
                (Math.random() - 0.5) * 14 -
                Math.sin(b.h) * side * 3,
              vy:
                -Math.sin(b.h) * 18 +
                (Math.random() - 0.5) * 14 +
                Math.cos(b.h) * side * 3,
              r: 2.5 + Math.random() * 3.5,
              life: 0,
              max: 0.85 + Math.random() * 0.7,
              col: b.shallow ? "#dff0e6" : "#eaf7f4",
            });
          }
        }
        function stepWake(dt) {
          for (let i = wake.length - 1; i >= 0; i--) {
            const p = wake[i];
            p.life += dt;
            if (p.life > p.max) {
              wake.splice(i, 1);
              continue;
            }
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vx *= 0.965;
            p.vy *= 0.965;
            p.r += dt * 7;
          }
          if (wake.length > 900) wake.splice(0, wake.length - 900);
        }

        /* ============================================================
   RANKING
   ============================================================ */
        function ranked() {
          return boats.slice().sort((a, b) => {
            const pa = a.lap * track.n + a.idx,
              pb = b.lap * track.n + b.idx;
            if (a.done && b.done) return a.total - b.total;
            if (a.done) return -1;
            if (b.done) return 1;
            return pb - pa;
          });
        }

        /* ============================================================
   UPDATE
   ============================================================ */
        function update(dt) {
          if (state === S.count) {
            countT -= dt;
            const v = Math.ceil(countT - 1);
            cdEl.textContent = countT <= 1 ? "GO" : v > 0 ? v : "";
            cdEl.classList.toggle("go", countT <= 1);
            if (countT <= 0) {
              state = S.race;
              cdEl.textContent = "";
              for (const b of boats) b.lapStart = 0;
            }
            for (const b of boats) {
              stepBoat(b, dt, { steer: 0, thr: 0 });
            }
            return;
          }
          if (state !== S.race) {
            stepFauna(dt);
            stepMoored(dt);
            stepWake(dt);
            return;
          }

          raceT += dt;
          stepFauna(dt);
          stepMoored(dt);
          slipstream();
          for (const b of boats) {
            if (b.chomped > 0) b.chomped -= dt;
            if (b.eaten > 0) {
              // in the shark. nothing to steer.
              b.eaten -= dt;
              if (b.eaten <= 0) respawn(b);
              continue;
            }
            const ctl = b.ai
              ? autopilot(b, dt)
              : me.done
                ? { steer: 0, thr: 0 }
                : controls();
            stepBoat(b, dt, ctl);
            emitWake(b, dt);
            if (b.boost > 0 && !REDUCED && Math.random() < dt * 30)
              spray(
                b.x - Math.cos(b.h) * 16,
                b.y - Math.sin(b.h) * 16,
                "#ffd84a",
                1.2,
              );
            if (
              b.shallow &&
              Math.hypot(b.vx, b.vy) > 50 &&
              Math.random() < dt * 22
            )
              spray(b.x, b.y, "#d9ead0", 1);
          }
          separate();
          stepWake(dt);

          // chartplotter breadcrumb
          trailAcc += dt;
          if (trailAcc > 0.08) {
            trailAcc = 0;
            const l = trail[trail.length - 1];
            if (!l || Math.hypot(l.x - me.x, l.y - me.y) > 10) {
              trail.push({ x: me.x, y: me.y });
              if (trail.length > 900) trail.shift();
            }
          }

          if (me.done && state === S.race) finish();
        }

        /* ============================================================
   RENDER
   ============================================================ */
        let waveT = 0;
        function render(dt) {
          waveT += dt;
          // camera
          const lead = state === S.race ? 0.34 : 0;
          const tx = me.x + me.vx * lead,
            ty = me.y + me.vy * lead;
          const k = 1 - Math.pow(0.0016, dt);
          cam.x += (tx - cam.x) * k;
          cam.y += (ty - cam.y) * k;
          const base = Math.min(Math.max(Math.min(W, H) / 620, 0.62), 1.25);
          const zoom =
            base * (1 - (Math.min(Math.hypot(me.vx, me.vy), TOP) / TOP) * 0.1);
          cam.s += (zoom - cam.s) * Math.min(1, dt * 2.2);

          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

          // --- shallows (screen-space pattern, drifting like a tide) ---
          ctx.save();
          const dxp = REDUCED ? 0 : (waveT * 7) % 200,
            dyp = REDUCED ? 0 : (waveT * 3) % 200;
          ctx.translate(
            ((-cam.x * cam.s) % 200) + dxp,
            ((-cam.y * cam.s) % 200) + dyp,
          );
          ctx.fillStyle = shoalPat;
          ctx.fillRect(-400, -400, W + 800, H + 800);
          ctx.restore();

          // --- world transform ---
          ctx.save();
          ctx.translate(W / 2, H / 2);
          ctx.scale(cam.s, cam.s);
          ctx.translate(-cam.x, -cam.y);

          // wildlife lives out on the flats, so it goes down before the banks
          const vr = (Math.max(W, H) / cam.s) * 0.75 + 200;
          for (const c of FAUNA)
            if (Math.abs(c.x - cam.x) < vr && Math.abs(c.y - cam.y) < vr)
              drawCreature(c);

          for (const m of MOORED)
            if (Math.abs(m.x - cam.x) < vr && Math.abs(m.y - cam.y) < vr)
              drawYacht(m);

          // channel path (cached — these centrelines run to 400+ points)
          if (!track._path) {
            const p = new Path2D();
            p.moveTo(track.pts[0].x, track.pts[0].y);
            for (let i = 1; i < track.n; i++)
              p.lineTo(track.pts[i].x, track.pts[i].y);
            p.closePath();
            track._path = p;
            // lines of flow at four stations across the river
            track._flow = [-0.62, -0.22, 0.22, 0.62].map((k) => {
              const q = new Path2D();
              for (let i = 0; i < track.n; i++) {
                const c = track.pts[i],
                  nv = track.nrm[i];
                const x = c.x + nv.x * k * track.half,
                  y = c.y + nv.y * k * track.half;
                i ? q.lineTo(x, y) : q.moveTo(x, y);
              }
              q.closePath();
              return q;
            });
          }
          const path = track._path;

          ctx.lineJoin = "round";
          ctx.lineCap = "round";
          ctx.strokeStyle = "#b8a67e";
          ctx.lineWidth = track.width + 74;
          ctx.stroke(path); // sand bar
          ctx.strokeStyle = "#2f8a86";
          ctx.lineWidth = track.width + 46;
          ctx.stroke(path); // margin
          ctx.strokeStyle = "#0f5f6d";
          ctx.lineWidth = track.width + 22;
          ctx.stroke(path); // shelf
          ctx.strokeStyle = "#072a3a";
          ctx.lineWidth = track.width;
          ctx.stroke(path); // deep water

          // current: dashes sliding downstream
          if (!REDUCED) {
            ctx.save();
            ctx.strokeStyle = "rgba(127,233,216,.13)";
            ctx.lineWidth = 2;
            ctx.setLineDash([22, 64]);
            ctx.lineDashOffset = -waveT * 110;
            for (const f of track._flow) ctx.stroke(f);
            ctx.restore();
          }
          ctx.strokeStyle = "rgba(127,233,216,.09)";
          ctx.lineWidth = 2;
          ctx.setLineDash([16, 22]);
          ctx.stroke(path);
          ctx.setLineDash([]);

          // start / finish
          const sp = track.pts[0],
            sn = track.nrm[0];
          ctx.save();
          ctx.strokeStyle = "rgba(234,247,244,.85)";
          ctx.lineWidth = 5;
          ctx.setLineDash([11, 9]);
          ctx.beginPath();
          ctx.moveTo(sp.x - sn.x * track.half, sp.y - sn.y * track.half);
          ctx.lineTo(sp.x + sn.x * track.half, sp.y + sn.y * track.half);
          ctx.stroke();
          ctx.restore();

          drawBoosts();

          // wake under the hulls
          for (const p of wake) {
            const a = 1 - p.life / p.max;
            ctx.globalAlpha = a * 0.5;
            ctx.fillStyle = p.col;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, 7);
            ctx.fill();
          }
          ctx.globalAlpha = 1;

          // buoys
          const blink = Math.sin(waveT * 3.2) * 0.5 + 0.5;
          for (const by of track.buoys) {
            ctx.fillStyle = "rgba(0,0,0,.28)";
            ctx.beginPath();
            ctx.ellipse(by.x + 3, by.y + 4, 10, 7, 0, 0, 7);
            ctx.fill();
            ctx.fillStyle = by.side === "port" ? "#e8402a" : "#2fcb7b";
            ctx.beginPath();
            ctx.arc(by.x, by.y, 9, 0, 7);
            ctx.fill();
            ctx.fillStyle = "rgba(4,20,28,.55)";
            ctx.beginPath();
            ctx.arc(by.x, by.y, 4.4, 0, 7);
            ctx.fill();
            ctx.globalAlpha = 0.25 + blink * 0.55;
            ctx.fillStyle = by.side === "port" ? "#ff8a7a" : "#9dffc9";
            ctx.beginPath();
            ctx.arc(by.x, by.y, 2.2, 0, 7);
            ctx.fill();
            ctx.globalAlpha = 1;
          }

          // boats, hindmost first
          for (let i = frameRanked.length - 1; i >= 0; i--)
            drawBoat(frameRanked[i]);

          // a shark mid-attack goes over the top of the hull it's taking
          for (const c of FAUNA) if (c.hunt || c.feed > 0) drawCreature(c);

          ctx.restore();
        }

        function hull(b) {
          ctx.beginPath();
          ctx.moveTo(19, 0);
          ctx.quadraticCurveTo(8, -8.5, -9, -8);
          ctx.lineTo(-15, -7);
          ctx.lineTo(-15, 7);
          ctx.lineTo(-9, 8);
          ctx.quadraticCurveTo(8, 8.5, 19, 0);
          ctx.closePath();
          ctx.fillStyle = b.col;
          ctx.fill();
          ctx.strokeStyle = "rgba(4,20,28,.55)";
          ctx.lineWidth = 1.4;
          ctx.stroke();
          ctx.fillStyle = b.trim;
          ctx.beginPath();
          ctx.moveTo(11, 0);
          ctx.quadraticCurveTo(2, -5, -6, -4.6);
          ctx.lineTo(-6, 4.6);
          ctx.quadraticCurveTo(2, 5, 11, 0);
          ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "rgba(4,20,28,.72)";
          ctx.fillRect(-5, -3.4, 7, 6.8);
          ctx.fillStyle = "rgba(4,20,28,.8)";
          ctx.fillRect(-19, -2.6, 5, 5.2);
        }

        function drawBoat(b) {
          // being eaten: the hull rolls, sinks and is gone in about half a second
          if (b.eaten > 0) {
            const p = Math.min(1, (1.7 - b.eaten) / 0.55);
            if (p >= 1) return;
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(b.h + p * 2.4);
            ctx.globalAlpha = 1 - p;
            ctx.scale(1 - p * 0.75, 1 - p * 0.75);
            hull(b);
            ctx.restore();
            ctx.globalAlpha = 1;
            return;
          }
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.rotate(b.h);

          ctx.fillStyle = "rgba(0,4,8,.30)";
          ctx.beginPath();
          ctx.ellipse(2, 4, 17, 9, 0, 0, 7);
          ctx.fill();
          hull(b);

          if (b.boost > 0) {
            ctx.globalAlpha =
              Math.min(1, b.boost * 1.6) * (0.55 + Math.sin(waveT * 30) * 0.2);
            ctx.fillStyle = "#ffd84a";
            ctx.beginPath();
            ctx.moveTo(-15, -5);
            ctx.lineTo(-15 - 14 - Math.random() * 12, 0);
            ctx.lineTo(-15, 5);
            ctx.closePath();
            ctx.fill();
            ctx.globalAlpha = 1;
          }
          if (b.bump > 0) {
            ctx.globalAlpha = Math.min(1, b.bump * 2.6);
            ctx.strokeStyle = "#eaf7f4";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(0, 0, 20, 0, 7);
            ctx.stroke();
            ctx.globalAlpha = 1;
          }
          ctx.restore();

          if (b === me) {
            ctx.save();
            ctx.strokeStyle = "rgba(255,216,74,.55)";
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.arc(b.x, b.y, 26, 0, 7);
            ctx.stroke();
            ctx.restore();
          }
        }

        /* ============================================================
   CHARTPLOTTER
   ============================================================ */
        const plot = document.getElementById("plot"),
          pctx = plot.getContext("2d");
        let plotFit = null,
          plotCache = null;
        function fitPlot() {
          const bd = track.bounds,
            pad = 12,
            size = plot.width;
          const s = Math.min(
            (size - pad * 2) / (bd.maxx - bd.minx),
            (size - pad * 2) / (bd.maxy - bd.miny),
          );
          plotFit = {
            s,
            ox: (size - (bd.maxx - bd.minx) * s) / 2 - bd.minx * s,
            oy: (size - (bd.maxy - bd.miny) * s) / 2 - bd.miny * s,
          };
          plotCache = null;
        }
        function buildPlotCache() {
          const c = document.createElement("canvas");
          c.width = plot.width;
          c.height = plot.height;
          const g = c.getContext("2d");
          const f = plotFit,
            X = (p) => p.x * f.s + f.ox,
            Y = (p) => p.y * f.s + f.oy;
          g.strokeStyle = "rgba(127,233,216,.07)";
          g.lineWidth = 1;
          for (let i = 0; i <= 4; i++) {
            const q = (i * plot.width) / 4;
            g.beginPath();
            g.moveTo(q, 0);
            g.lineTo(q, plot.height);
            g.moveTo(0, q);
            g.lineTo(plot.width, q);
            g.stroke();
          }
          g.lineJoin = g.lineCap = "round";
          g.beginPath();
          g.moveTo(X(track.pts[0]), Y(track.pts[0]));
          for (let i = 1; i < track.n; i++)
            g.lineTo(X(track.pts[i]), Y(track.pts[i]));
          g.closePath();
          g.strokeStyle = "rgba(12,66,87,.95)";
          g.lineWidth = track.width * f.s;
          g.stroke();
          g.strokeStyle = "rgba(127,233,216,.16)";
          g.lineWidth = 1.4;
          g.stroke();
          const sp = track.pts[0],
            sn = track.nrm[0];
          g.strokeStyle = "rgba(234,247,244,.6)";
          g.lineWidth = 1.6;
          g.beginPath();
          g.moveTo(
            (sp.x - sn.x * track.half) * f.s + f.ox,
            (sp.y - sn.y * track.half) * f.s + f.oy,
          );
          g.lineTo(
            (sp.x + sn.x * track.half) * f.s + f.ox,
            (sp.y + sn.y * track.half) * f.s + f.oy,
          );
          g.stroke();
          plotCache = c;
        }
        function drawPlot() {
          if (!plotFit) fitPlot();
          if (!plotCache) buildPlotCache();
          const f = plotFit,
            X = (p) => p.x * f.s + f.ox,
            Y = (p) => p.y * f.s + f.oy;
          pctx.clearRect(0, 0, plot.width, plot.height);
          pctx.drawImage(plotCache, 0, 0);

          if (trail.length > 1) {
            for (let i = 1; i < trail.length; i++) {
              const a = i / trail.length;
              pctx.strokeStyle = "rgba(127,233,216," + (0.1 + a * 0.85) + ")";
              pctx.lineWidth = 1.2 + a * 1.9;
              pctx.beginPath();
              pctx.moveTo(X(trail[i - 1]), Y(trail[i - 1]));
              pctx.lineTo(X(trail[i]), Y(trail[i]));
              pctx.stroke();
            }
          }

          for (const b of boats) {
            pctx.fillStyle = b.col;
            pctx.beginPath();
            pctx.arc(X(b), Y(b), b === me ? 5 : 3.6, 0, 7);
            pctx.fill();
            if (b === me) {
              pctx.strokeStyle = "rgba(4,20,28,.9)";
              pctx.lineWidth = 1.6;
              pctx.stroke();
            }
          }
        }

        /* ============================================================
   HUD
   ============================================================ */
        const hud = document.getElementById("hud"),
          cdEl = document.getElementById("countdown");
        const lapEl = document.getElementById("lap"),
          lapMaxEl = document.getElementById("lapMax");
        const posEl = document.getElementById("pos"),
          posMaxEl = document.getElementById("posMax");
        const clockEl = document.getElementById("clock"),
          lastEl = document.getElementById("last"),
          bestEl = document.getElementById("best");
        const knEl = document.getElementById("kn"),
          barEl = document.getElementById("bar"),
          warnEl = document.getElementById("warn");
        const draftEl = document.getElementById("draft"),
          recEl = document.getElementById("rec");
        const boostEl = document.getElementById("boost"),
          sharkEl = document.getElementById("shark");

        function fmt(t) {
          if (!t) return "—";
          const m = Math.floor(t / 60),
            s = t - m * 60;
          return m + ":" + (s < 10 ? "0" : "") + s.toFixed(1);
        }
        function drawHUD() {
          const place = frameRanked.indexOf(me) + 1;
          lapEl.textContent = Math.min(Math.max(me.lap + 1, 1), totalLaps);
          lapMaxEl.textContent = totalLaps;
          posEl.textContent = place;
          posMaxEl.textContent = boats.length;
          clockEl.textContent = fmt(raceT) === "—" ? "0:00.0" : fmt(raceT);
          lastEl.textContent = fmt(me.lastLap);
          bestEl.textContent = fmt(me.bestLap);
          recEl.textContent = fmt(bestLapFor(track.name));
          const spd = Math.hypot(me.vx, me.vy);
          knEl.textContent = Math.round(spd * 0.26);
          barEl.firstElementChild.style.width =
            Math.min(100, (spd / TOP) * 100) + "%";
          barEl.classList.toggle("hot", spd > TOP * 0.86);
          const t = track.tan[me.idx];
          warnEl.classList.toggle(
            "on",
            state === S.race &&
              !me.hunter &&
              !me.eaten &&
              me.vx * t.x + me.vy * t.y < -25,
          );
          draftEl.classList.toggle("on", !!me.drafting);
          boostEl.classList.toggle("on", me.boost > 0);
          if (me.boost > 0)
            boostEl
              .querySelector("i")
              .style.setProperty("--w", (me.boost / 2.2) * 100 + "%");
          if (me.chomped > 0) {
            sharkEl.textContent = "Eaten";
            sharkEl.className = "bit";
          } else if (me.hunter) {
            sharkEl.textContent = "Shark — get back in the river";
            sharkEl.className = "on";
          } else sharkEl.className = "";
          drawPlot();
        }

        /* ============================================================
   FINISH
   ============================================================ */
        const resultsEl = document.getElementById("results"),
          rBody = document.getElementById("rBody");
        const rTitle = document.getElementById("rTitle"),
          rSub = document.getElementById("rSub");

        function ordinal(k) {
          const suf = ["th", "st", "nd", "rd"],
            v = k % 100;
          return k + (suf[(v - 20) % 10] || suf[v] || suf[0]);
        }

        function finish() {
          state = S.done;
          const r = frameRanked,
            place = r.indexOf(me) + 1;
          rTitle.textContent = place === 1 ? "Won it" : ordinal(place);
          const tail =
            place === 1
              ? "Clean water all the way home."
              : "The leader is still out there somewhere.";
          const bits = ["your best lap " + fmt(me.bestLap)];
          if (newLapRecord) bits.push("new lap record");
          if (newTotalRecord) bits.push("new " + totalLaps + "-lap record");
          rSub.textContent =
            track.name +
            " · " +
            totalLaps +
            " laps · " +
            bits.join(" · ") +
            ". " +
            tail;
          refreshRecords();
          rBody.innerHTML = "";
          r.forEach((b, i) => {
            const tr = document.createElement("tr");
            if (b === me) tr.className = "you";
            let totalCell;
            if (b.done) {
              totalCell = '<td class="t">' + fmt(b.total) + "</td>";
            } else {
              const est = projectTotal(b);
              totalCell = est
                ? '<td class="t est" title="projected finish time">~' +
                  fmt(est) +
                  "</td>"
                : '<td class="t dnf">lap ' +
                  Math.min(b.lap + 1, totalLaps) +
                  "</td>";
            }
            tr.innerHTML =
              '<td class="pos">' +
              (i + 1) +
              "</td>" +
              '<td class="nm">' +
              b.name +
              "</td>" +
              '<td class="t">' +
              fmt(b.bestLap) +
              "</td>" +
              totalCell;
            rBody.appendChild(tr);
          });
          resultsEl.classList.remove("hidden");
          document.body.classList.remove("racing");
          touch.classList.remove("on");
        }

        function projectTotal(b) {
          if (b.done) return b.total;
          if (!raceT) return 0;
          const n = track.n;
          const frac = Math.max(0, Math.min(0.999, b.idx / n));
          const progress = Math.max(0, b.lap) + frac;
          if (progress <= 0.05) return 0;
          return (raceT / progress) * totalLaps;
        }

        /* ============================================================
   MENU
   ============================================================ */
        const menuEl = document.getElementById("menu"),
          coursesEl = document.getElementById("courses");
        TRACKS.forEach((t, i) => {
          const el = document.createElement("button");
          el.className = "course" + (i === 0 ? " sel" : "");
          el.innerHTML =
            '<canvas width="220" height="150"></canvas><div><h3>' +
            t.name +
            "</h3><p>" +
            t.desc +
            "</p>" +
            '<p class="tilerec"></p></div>';
          const c = el.querySelector("canvas"),
            g = c.getContext("2d");
          const bd = t.bounds,
            pad = 12;
          const s = Math.min(
            (c.width - pad * 2) / (bd.maxx - bd.minx),
            (c.height - pad * 2) / (bd.maxy - bd.miny),
          );
          const ox = (c.width - (bd.maxx - bd.minx) * s) / 2 - bd.minx * s,
            oy = (c.height - (bd.maxy - bd.miny) * s) / 2 - bd.miny * s;
          g.lineJoin = g.lineCap = "round";
          g.beginPath();
          g.moveTo(t.pts[0].x * s + ox, t.pts[0].y * s + oy);
          for (let k = 1; k < t.n; k++)
            g.lineTo(t.pts[k].x * s + ox, t.pts[k].y * s + oy);
          g.closePath();
          g.strokeStyle = "#0c4257";
          g.lineWidth = t.width * s;
          g.stroke();
          g.strokeStyle = "rgba(127,233,216,.35)";
          g.lineWidth = 1;
          g.stroke();
          for (const by of t.buoys) {
            g.fillStyle = by.side === "port" ? "#e8402a" : "#2fcb7b";
            g.beginPath();
            g.arc(by.x * s + ox, by.y * s + oy, 1.7, 0, 7);
            g.fill();
          }
          el.onclick = () => {
            courseIdx = i;
            plotFit = null;
            track = TRACKS[i];
            track._path = null;
            spawnFauna();
            spawnBoosts();
            spawnMoored();
            coursesEl
              .querySelectorAll(".course")
              .forEach((n) => n.classList.remove("sel"));
            el.classList.add("sel");
            syncCourses();
          };
          coursesEl.appendChild(el);
        });

        /* The menu leads with two full rows of courses and keeps the rest behind a
   toggle, so the sheet doesn't open as a wall of thumbnails. */
        const SHOWN = 6;
        const moreEl = document.getElementById("more");
        let expanded = false;

        function syncCourses() {
          coursesEl.querySelectorAll(".course").forEach((el, i) => {
            // a course picked out of the full list stays on show once it collapses again
            el.classList.toggle(
              "hidden",
              !expanded && i >= SHOWN && i !== courseIdx,
            );
          });
          moreEl.textContent = expanded
            ? "Fewer courses"
            : "More courses · " + (TRACKS.length - SHOWN);
          moreEl.setAttribute("aria-expanded", expanded);
        }
        moreEl.onclick = () => {
          expanded = !expanded;
          syncCourses();
        };
        syncCourses();

        /* records can change between visits to the menu, so the tiles are refreshed
   rather than baked in when they're built */
        function refreshRecords() {
          coursesEl.querySelectorAll(".course").forEach((el, i) => {
            const name = TRACKS[i].name;
            const lap = bestLapFor(name);
            const total = bestTotalFor(name, totalLaps);
            const parts = [];
            if (lap) parts.push("Lap " + fmt(lap));
            if (total) parts.push(totalLaps + "-lap " + fmt(total));
            el.querySelector(".tilerec").textContent = parts.join(" · ");
          });
        }
        refreshRecords();

        function segment(id, attr, set) {
          const wrap = document.getElementById(id);
          wrap.addEventListener("click", (e) => {
            const b = e.target.closest("button");
            if (!b) return;
            wrap
              .querySelectorAll("button")
              .forEach((n) => n.classList.remove("sel"));
            b.classList.add("sel");
            set(+b.dataset[attr]);
          });
        }
        segment("laps", "l", (v) => {
          totalLaps = v;
          refreshRecords();
        });
        segment("skill", "s", (v) => {
          skill = v;
        });

        const nameInput = document.getElementById("playerName");
        if (nameInput) {
          nameInput.value = SETTINGS.name || "";
          nameInput.addEventListener("input", () => {
            SETTINGS.name = nameInput.value.slice(0, 18);
            saveSettings();
          });
        }

        document.getElementById("start").onclick = () => {
          initAudio();
          plotFit = null;
          startRace();
        };
        document.getElementById("again").onclick = () => {
          initAudio();
          startRace();
        };
        document.getElementById("back").onclick = () => {
          state = S.menu;
          resultsEl.classList.add("hidden");
          menuEl.classList.remove("hidden");
          refreshRecords();
          hud.classList.remove("on");
          document.body.classList.remove("racing");
          touch.classList.remove("on");
        };

        /* ============================================================
   PAUSE + SETTINGS
   ============================================================ */
        const pauseEl = document.getElementById("pauseMenu");
        const settingsEl = document.getElementById("settingsMenu");
        const pauseBtn = document.getElementById("pauseBtn");
        const musicTog = document.getElementById("musicToggle");
        const sfxTog = document.getElementById("sfxToggle");

        function syncToggles() {
          musicTog.dataset.on = SETTINGS.music ? "1" : "0";
          sfxTog.dataset.on = SETTINGS.sfx ? "1" : "0";
        }
        syncToggles();

        function pauseGame() {
          if (state !== S.race && state !== S.count) return;
          pausedFrom = state;
          state = S.pause;
          T.thr = 0;
          T.steer = 0;
          pauseEl.classList.remove("hidden");
          document.body.classList.remove("racing");
          touch.classList.remove("on");
        }
        function resumeGame() {
          if (state !== S.pause) return;
          state = pausedFrom || S.race;
          pausedFrom = null;
          pauseEl.classList.add("hidden");
          settingsEl.classList.add("hidden");
          document.body.classList.add("racing");
          touch.classList.toggle("on", isTouch);
        }
        function exitToMenu() {
          state = S.menu;
          pausedFrom = null;
          pauseEl.classList.add("hidden");
          settingsEl.classList.add("hidden");
          resultsEl.classList.add("hidden");
          menuEl.classList.remove("hidden");
          hud.classList.remove("on");
          document.body.classList.remove("racing");
          touch.classList.remove("on");
          refreshRecords();
        }

        let settingsReturn = null;
        function openSettings(from) {
          settingsReturn = from || null;
          syncToggles();
          settingsEl.classList.remove("hidden");
        }
        function closeSettings() {
          settingsEl.classList.add("hidden");
          if (settingsReturn === "pause") pauseEl.classList.remove("hidden");
          settingsReturn = null;
        }

        pauseBtn.onclick = pauseGame;
        document.getElementById("resumeBtn").onclick = resumeGame;
        document.getElementById("exitBtn").onclick = exitToMenu;
        document.getElementById("pauseSettingsBtn").onclick = () => {
          pauseEl.classList.add("hidden");
          openSettings("pause");
        };
        document.getElementById("homeSettings").onclick = () =>
          openSettings("menu");
        document.getElementById("settingsDone").onclick = closeSettings;

        musicTog.onclick = () => {
          SETTINGS.music = !SETTINGS.music;
          syncToggles();
          saveSettings();
        };
        sfxTog.onclick = () => {
          SETTINGS.sfx = !SETTINGS.sfx;
          syncToggles();
          saveSettings();
        };

        /* ============================================================
   LOOP
   ============================================================ */
        // idle backdrop so the menu isn't sitting on a flat colour
        track = TRACKS[0];
        me = makeBoat({
          x: track.pts[0].x,
          y: track.pts[0].y,
          col: "#ffd84a",
          trim: "#c99a12",
          power: 1,
          name: playerName(),
        });
        boats = [me];
        cam.x = me.x;
        cam.y = me.y;
        cam.s = 1;
        spawnFauna();
        spawnBoosts();

        let last = performance.now();
        let frameRanked = [];
        function loop(now) {
          const dt = Math.min((now - last) / 1000, 1 / 30);
          last = now;
          if (state === S.pause) {
            /* frozen frame, ambient audio only */
          } else if (state !== S.menu) update(dt);
          else {
            cam.x += Math.cos(now / 9000) * 0.35;
            cam.y += Math.sin(now / 7000) * 0.3;
            stepFauna(dt);
            stepMoored(dt);
            stepWake(dt);
          }
          frameRanked = ranked();
          render(dt);
          if (state !== S.menu) drawHUD();
          stepAudio();
          requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
