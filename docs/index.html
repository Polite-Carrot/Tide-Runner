<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Tiderunner — buoy racing</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <meta name="theme-color" content="#04141c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Tiderunner" />
    <style>
      :root {
        --abyss: #04141c;
        --deep: #072a3a;
        --shelf: #0c4257;
        --shoal: #157f86;
        --foam: #eaf7f4;
        --chart: #7fe9d8;
        --port: #e8402a;
        --stbd: #2fcb7b;
        --amber: #ffd84a;

        --panel: rgba(4, 20, 28, 0.74);
        --hair: rgba(127, 233, 216, 0.28);

        --display:
          "Barlow Condensed", "Arial Narrow", Haettenschweiler, Impact,
          sans-serif;
        --mono:
          "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas,
          monospace;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--abyss);
      }
      body {
        font-family: var(--mono);
        color: var(--foam);
        touch-action: none;
        user-select: none;
      }

      #game {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ---------- shared panel look ---------- */
      .panel {
        background: var(--panel);
        border: 1px solid var(--hair);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }
      .eyebrow {
        font-family: var(--mono);
        font-size: 9px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(127, 233, 216, 0.72);
      }
      .num {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }

      /* ---------- HUD ---------- */
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.35s;
      }
      #hud.on {
        opacity: 1;
      }

      /* one instrument row along the top: lap, place, speed, elapsed */
      .hud-tl {
        position: absolute;
        top: calc(10px + env(safe-area-inset-top));
        left: calc(10px + env(safe-area-inset-left));
        display: flex;
        gap: 6px;
        align-items: stretch;
      }
      .stat {
        padding: 6px 11px 7px;
        min-width: 66px;
      }
      .stat b {
        display: block;
        font-family: var(--display);
        font-weight: 700;
        font-size: 27px;
        line-height: 0.92;
        letter-spacing: 0.01em;
      }
      .stat b small {
        font-size: 14px;
        opacity: 0.5;
        font-weight: 600;
      }

      .stat.speed {
        width: 108px;
      }
      .kn {
        display: flex;
        align-items: baseline;
        gap: 5px;
      }
      .kn b {
        font-family: var(--display);
        font-weight: 700;
        font-size: 27px;
        line-height: 0.92;
      }
      .kn span {
        font-size: 10px;
        letter-spacing: 0.16em;
        color: rgba(234, 247, 244, 0.55);
      }
      .bar {
        margin-top: 6px;
        height: 4px;
        background: rgba(127, 233, 216, 0.14);
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0%;
        background: var(--chart);
        transition: width 0.07s linear;
      }
      .bar.hot i {
        background: var(--amber);
      }

      .stat.time {
        min-width: 120px;
      }
      .clock {
        font-family: var(--mono);
        font-weight: 600;
        font-size: 23px;
        line-height: 1.05;
        letter-spacing: -0.01em;
      }
      .splits {
        margin-top: 4px;
        font-size: 10.5px;
        line-height: 1.5;
        color: rgba(234, 247, 244, 0.62);
      }
      .splits i {
        font-style: normal;
        color: var(--chart);
      }
      .splits .best i {
        color: var(--amber);
      }
      .splits .rec i {
        color: var(--amber);
      }

      /* chartplotter has the top-right corner to itself */
      .hud-tr {
        position: absolute;
        top: calc(10px + env(safe-area-inset-top));
        right: calc(10px + env(safe-area-inset-right));
        padding: 8px 8px 6px;
      }
      .hud-tr .eyebrow {
        display: block;
        margin-bottom: 6px;
        padding: 0 2px;
      }
      #plot {
        display: block;
        width: 132px;
        height: 132px;
      }

      /* centre callouts */
      .callout {
        position: absolute;
        left: 50%;
        top: 26%;
        transform: translate(-50%, -50%);
        font-family: var(--display);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-align: center;
        text-shadow: 0 3px 22px rgba(0, 0, 0, 0.75);
      }
      #countdown {
        font-size: clamp(64px, 16vw, 132px);
        line-height: 1;
        color: var(--foam);
      }
      #countdown.go {
        color: var(--stbd);
      }
      #warn {
        position: absolute;
        left: 50%;
        top: 63%;
        transform: translate(-50%, -50%);
        font-family: var(--display);
        font-weight: 700;
        font-size: clamp(20px, 4.6vw, 30px);
        letter-spacing: 0.14em;
        color: var(--port);
        text-shadow: 0 2px 16px rgba(0, 0, 0, 0.8);
        opacity: 0;
        transition: opacity 0.12s;
      }
      #warn.on {
        opacity: 1;
        animation: blink 0.55s steps(1, end) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.25;
        }
      }
      #draft {
        position: absolute;
        left: 50%;
        bottom: calc(22px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        font-size: 10px;
        letter-spacing: 0.24em;
        color: var(--amber);
        opacity: 0;
        transition: opacity 0.18s;
        border: 1px solid rgba(255, 216, 74, 0.4);
        padding: 4px 10px;
        background: rgba(4, 20, 28, 0.6);
      }
      #draft.on {
        opacity: 1;
      }
      #boost {
        position: absolute;
        left: 50%;
        bottom: calc(52px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 11px;
        background: rgba(4, 20, 28, 0.62);
        border: 1px solid rgba(255, 216, 74, 0.55);
        opacity: 0;
        transition: opacity 0.15s;
      }
      #boost.on {
        opacity: 1;
      }
      #boost span {
        font-size: 10px;
        letter-spacing: 0.24em;
        color: var(--amber);
      }
      #boost i {
        display: block;
        width: 74px;
        height: 4px;
        background: rgba(255, 216, 74, 0.2);
        position: relative;
      }
      #boost i::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: var(--w, 0%);
        background: var(--amber);
      }
      #shark {
        position: absolute;
        left: 50%;
        top: 44%;
        transform: translate(-50%, -50%);
        font-family: var(--display);
        font-weight: 700;
        font-size: clamp(22px, 5.4vw, 36px);
        letter-spacing: 0.14em;
        color: var(--port);
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.85);
        opacity: 0;
        transition: opacity 0.12s;
        text-align: center;
        white-space: nowrap;
      }
      #shark.on {
        opacity: 1;
        animation: blink 0.4s steps(1, end) infinite;
      }
      #shark.bit {
        opacity: 1;
        animation: none;
        color: var(--foam);
      }

      /* ---------- screens ---------- */
      .screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(20px + env(safe-area-inset-top))
          calc(20px + env(safe-area-inset-right))
          calc(20px + env(safe-area-inset-bottom))
          calc(20px + env(safe-area-inset-left));
        background: radial-gradient(
          120% 90% at 50% 0%,
          rgba(12, 66, 87, 0.55),
          rgba(4, 20, 28, 0.94)
        );
        z-index: 5;
      }
      .screen.hidden {
        display: none;
      }
      .sheet {
        width: min(720px, 100%);
        max-height: 100%;
        overflow: auto;
        padding: 22px 22px 20px;
      }

      .brand {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        border-bottom: 1px solid var(--hair);
        padding-bottom: 12px;
        margin-bottom: 16px;
        position: relative;
      }
      h1 {
        margin: 0;
        font-family: var(--display);
        font-weight: 700;
        font-size: clamp(40px, 9vw, 66px);
        line-height: 0.86;
        letter-spacing: 0.005em;
        text-transform: uppercase;
      }
      h1 em {
        font-style: normal;
        color: var(--chart);
      }
      .tag {
        font-size: 11px;
        line-height: 1.6;
        color: rgba(234, 247, 244, 0.6);
        max-width: 270px;
        padding-right: 48px;
      }

      .label {
        font-size: 9.5px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(127, 233, 216, 0.72);
        margin: 0 0 8px;
      }

      .courses {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .course {
        padding: 10px 10px 8px;
        background: rgba(127, 233, 216, 0.04);
        border: 1px solid var(--hair);
        cursor: pointer;
        text-align: left;
        color: inherit;
        font: inherit;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .course:hover {
        background: rgba(127, 233, 216, 0.1);
      }
      .course.sel {
        border-color: var(--amber);
        background: rgba(255, 216, 74, 0.09);
      }
      .course canvas {
        display: block;
        width: 100%;
        height: auto;
        margin-bottom: 7px;
      }
      .course h3 {
        margin: 0;
        font-family: var(--display);
        font-weight: 600;
        font-size: 19px;
        line-height: 1;
        letter-spacing: 0.02em;
      }
      .course p {
        margin: 3px 0 0;
        font-size: 9.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: rgba(234, 247, 244, 0.5);
      }
      .course .tilerec {
        margin: 3px 0 0;
        color: var(--amber);
        opacity: 0.85;
        min-height: 12px;
      }
      .course.hidden {
        display: none;
      }

      .more {
        width: 100%;
        margin-top: 8px;
        padding: 9px;
        font: inherit;
        font-size: 9.5px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(127, 233, 216, 0.72);
        background: rgba(127, 233, 216, 0.04);
        border: 1px solid var(--hair);
        cursor: pointer;
        transition: background 0.15s;
      }
      .more:hover {
        background: rgba(127, 233, 216, 0.1);
      }
      .more:focus-visible {
        outline: 1px solid var(--chart);
        outline-offset: 2px;
      }

      .row {
        display: flex;
        gap: 18px;
        align-items: flex-end;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .seg {
        display: flex;
        border: 1px solid var(--hair);
      }
      .seg button {
        font: inherit;
        font-size: 13px;
        color: rgba(234, 247, 244, 0.62);
        background: transparent;
        border: 0;
        padding: 7px 14px;
        cursor: pointer;
      }
      .seg button + button {
        border-left: 1px solid var(--hair);
      }
      .seg button.sel {
        background: var(--chart);
        color: #04141c;
        font-weight: 600;
      }
      .name-field {
        flex: 1 1 200px;
        min-width: 180px;
      }
      .name-field .opt {
        opacity: 0.55;
        font-weight: 400;
        letter-spacing: 0.14em;
      }
      .name-input {
        width: 100%;
        max-width: 280px;
        font: inherit;
        font-size: 15px;
        background: rgba(127, 233, 216, 0.06);
        border: 1px solid var(--hair);
        color: var(--foam);
        padding: 8px 11px;
        letter-spacing: 0.02em;
      }
      .name-input:focus {
        outline: 1px solid var(--chart);
        background: rgba(127, 233, 216, 0.1);
      }
      .name-input::placeholder {
        color: rgba(234, 247, 244, 0.35);
      }

      .go-btn {
        margin-left: auto;
        font-family: var(--display);
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        padding: 11px 30px 10px;
        cursor: pointer;
        background: var(--amber);
        color: #04141c;
        border: 0;
        transition:
          transform 0.12s,
          filter 0.15s;
      }
      .go-btn:hover {
        filter: brightness(1.09);
      }
      .go-btn:active {
        transform: translateY(1px);
      }

      .keys {
        margin-top: 16px;
        padding-top: 13px;
        border-top: 1px solid var(--hair);
        font-size: 10.5px;
        line-height: 1.9;
        color: rgba(234, 247, 244, 0.55);
        letter-spacing: 0.02em;
      }
      .keys kbd {
        font-family: var(--mono);
        font-size: 10px;
        background: rgba(127, 233, 216, 0.12);
        border: 1px solid var(--hair);
        padding: 2px 6px;
        color: var(--chart);
      }

      /* results */
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 4px;
      }
      th {
        font-size: 9px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(127, 233, 216, 0.7);
        text-align: left;
        font-weight: 400;
        padding: 0 8px 7px 0;
        border-bottom: 1px solid var(--hair);
      }
      td {
        padding: 9px 8px 9px 0;
        border-bottom: 1px solid rgba(127, 233, 216, 0.12);
        font-size: 13px;
      }
      tr.you td {
        color: var(--amber);
      }
      td.pos {
        font-family: var(--display);
        font-weight: 700;
        font-size: 21px;
        width: 34px;
        line-height: 1;
      }
      td.nm {
        font-family: var(--display);
        font-weight: 600;
        font-size: 17px;
        letter-spacing: 0.02em;
      }
      td.t {
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-size: 12.5px;
      }
      .dnf {
        color: rgba(234, 247, 244, 0.35);
      }
      .est {
        color: rgba(234, 247, 244, 0.72);
        font-style: italic;
      }
      .btnrow {
        display: flex;
        gap: 9px;
        margin-top: 18px;
        flex-wrap: wrap;
      }
      .ghost {
        font-family: var(--display);
        font-weight: 600;
        font-size: 17px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 9px 18px;
        background: transparent;
        color: var(--chart);
        border: 1px solid var(--hair);
        cursor: pointer;
      }
      .ghost:hover {
        background: rgba(127, 233, 216, 0.1);
      }

      /* ---------- startup identity ---------- */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: #000;
        display: grid;
        place-items: center;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.55s ease;
      }
      #boot.done {
        opacity: 0;
      }
      .boot-lockup {
        display: grid;
        justify-items: center;
        width: min(68vw, 52vh, 360px);
      }
      .boot-mark {
        display: block;
        width: 92%;
        height: auto;
        opacity: 0;
        transform: scale(0.94);
        animation: boot-logo 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) 0.18s forwards;
      }
      .boot-name {
        display: block;
        width: 100%;
        height: auto;
        margin-top: 12px;
        opacity: 0;
        transform: translateY(8px);
        animation: boot-name 0.55s ease 0.72s forwards;
      }
      @keyframes boot-logo {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes boot-name {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ---------- touch controls ---------- */
      #touch {
        position: fixed;
        inset: 0;
        z-index: 4;
        display: none;
        pointer-events: none;
      }
      #touch.on {
        display: block;
        pointer-events: auto;
        touch-action: none;
      }
      .joy {
        --joy-size: clamp(120px, 20vmin, 156px);
        position: absolute;
        left: 0;
        top: 0;
        width: var(--joy-size);
        height: var(--joy-size);
        border-radius: 50%;
        border: 1px solid rgba(127, 233, 216, 0.42);
        background: rgba(4, 20, 28, 0.58);
        box-shadow:
          inset 0 0 0 1px rgba(234, 247, 244, 0.04),
          0 8px 28px rgba(0, 0, 0, 0.24);
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.86);
        transition:
          opacity 0.1s ease,
          transform 0.1s ease;
        pointer-events: none;
        user-select: none;
      }
      .joy::before,
      .joy::after {
        content: "";
        position: absolute;
        background: rgba(127, 233, 216, 0.16);
        pointer-events: none;
      }
      .joy::before {
        left: 18%;
        right: 18%;
        top: 50%;
        height: 1px;
      }
      .joy::after {
        top: 18%;
        bottom: 18%;
        left: 50%;
        width: 1px;
      }
      .joy.act {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        background: rgba(4, 20, 28, 0.76);
        border-color: rgba(127, 233, 216, 0.72);
      }
      .joy .thumb {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 42%;
        height: 42%;
        border-radius: 50%;
        background: rgba(127, 233, 216, 0.58);
        border: 1px solid rgba(234, 247, 244, 0.82);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
        transform: translate(-50%, -50%);
        pointer-events: none;
        transition: transform 0.12s ease-out;
      }
      .joy.act .thumb {
        transition: none;
      }

      /* ---------- pause + settings ---------- */
      .pause-btn {
        position: fixed;
        bottom: calc(22px + env(safe-area-inset-bottom));
        right: calc(20px + env(safe-area-inset-right));
        z-index: 6;
        pointer-events: auto;
        cursor: pointer;
        display: none;
        align-items: center;
        justify-content: center;
        width: 46px;
        height: 46px;
        padding: 0;
        border-radius: 50%;
        color: var(--chart);
        background: var(--panel);
        border: 1px solid var(--hair);
        font: inherit;
      }
      body.racing .pause-btn {
        display: inline-flex;
      }
      .pause-btn::before,
      .pause-btn::after {
        content: "";
        display: block;
        width: 5px;
        height: 16px;
        background: var(--chart);
        border-radius: 1px;
      }
      .pause-btn::before {
        margin-right: 5px;
      }
      .gear {
        position: absolute;
        top: 0;
        right: 0;
        width: 36px;
        height: 36px;
        padding: 0;
        display: grid;
        place-items: center;
        border: 1px solid var(--hair);
        background: rgba(127, 233, 216, 0.04);
        color: var(--chart);
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
      }
      .gear:hover {
        background: rgba(127, 233, 216, 0.1);
      }
      .setrow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 14px 4px;
        border-bottom: 1px solid var(--hair);
      }
      .setrow label {
        font-family: var(--display);
        font-weight: 600;
        font-size: 20px;
        letter-spacing: 0.04em;
      }
      .toggle {
        width: 54px;
        height: 28px;
        border-radius: 14px;
        border: 1px solid var(--hair);
        background: rgba(127, 233, 216, 0.08);
        position: relative;
        cursor: pointer;
        padding: 0;
        transition: background 0.16s ease;
      }
      .toggle span {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--foam);
        transition:
          left 0.16s ease,
          background 0.16s ease;
      }
      .toggle[data-on="1"] {
        background: var(--chart);
      }
      .toggle[data-on="1"] span {
        left: 28px;
        background: #04141c;
      }
      .btnstack {
        display: flex;
        flex-direction: column;
        gap: 9px;
        margin-top: 18px;
      }
      .btnstack .go-btn,
      .btnstack .ghost {
        margin: 0;
        width: 100%;
        text-align: center;
      }

      @media (max-width: 560px) {
        .courses {
          grid-template-columns: 1fr;
          gap: 6px;
        }
        .course {
          display: flex;
          align-items: center;
          gap: 11px;
        }
        .course canvas {
          width: 64px;
          margin: 0;
          flex: 0 0 auto;
        }
        /* the instrument row wraps beside the plotter rather than running under it */
        .hud-tl {
          gap: 4px;
          flex-wrap: wrap;
          right: calc(122px + env(safe-area-inset-right));
        }
        .stat {
          padding: 5px 8px 6px;
          min-width: 54px;
        }
        .stat b {
          font-size: 21px;
        }
        .kn b {
          font-size: 21px;

          {

            width: 296,
            fleet: 12,

              cy: 1050,
              R: 880,
              ax: 1.32,
              ay: 0.97,

        const SAMPLES = 15; // centreline points per control segment
        const GATE_GAP = 230; // buoy gate spacing, in world px

        function meander(o) {
          const cps = [];
          for (let i = 0; i < o.count; i++) {
            const th = (i / o.count) * Math.PI * 2;
            const r =
              o.R *
              (1 +
                o.amp * Math.sin(o.k * th + (o.phase || 0)) +
                (o.amp2 || 0) * Math.sin((o.k2 || 3) * th + 1.1));
            cps.push([
              o.cx + Math.cos(th) * r * (o.ax || 1),
              o.cy + Math.sin(th) * r * (o.ay || 1),
            ]);
          }
          return cps;
        }

        function smoothClosed(cps) {
          const out = [],
            n = cps.length;
          for (let i = 0; i < n; i++) {
            const p0 = cps[(i - 1 + n) % n],
              p1 = cps[i],
              p2 = cps[(i + 1) % n],
              p3 = cps[(i + 2) % n];
            for (let k = 0; k < SAMPLES; k++) {
              const s = k / SAMPLES,
                s2 = s * s,
                s3 = s2 * s;
              out.push({
                x:
                  0.5 *
                  (2 * p1[0] +
                    (-p0[0] + p2[0]) * s +
                    (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * s2 +
                    (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * s3),
                y:
                  0.5 *
                  (2 * p1[1] +
                    (-p0[1] + p2[1]) * s +
                    (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * s2 +
                    (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * s3),
              });
            }
          }
          return out;
        }

        function buildTrack(def) {
          const pts = smoothClosed(def.cps || meander(def.gen)),
            n = pts.length;
          // tangents + normals
          const tan = [],
            nrm = [];
          for (let i = 0; i < n; i++) {
            const a = pts[(i - 1 + n) % n],
              b = pts[(i + 1) % n];
            let dx = b.x - a.x,
              dy = b.y - a.y;
            const m = Math.hypot(dx, dy) || 1;
            dx /= m;
            dy /= m;
            tan.push({ x: dx, y: dy });
            nrm.push({ x: -dy, y: dx });
          }
          const half = def.width / 2;
          let peri = 0;
          for (let i = 0; i < n; i++) {
            const a = pts[i],
              b = pts[(i + 1) % n];
            peri += Math.hypot(b.x - a.x, b.y - a.y);
          }
          const gateEvery = Math.max(4, Math.round(GATE_GAP / (peri / n)));
          const buoys = [];
          for (let i = 0; i < n; i += gateEvery) {
            const p = pts[i],
              nv = nrm[i],
              off = half - 9;
            buoys.push({
              x: p.x - nv.x * off,
              y: p.y - nv.y * off,
              side: "port",
              i,
            });
            buoys.push({
              x: p.x + nv.x * off,
              y: p.y + nv.y * off,
              side: "stbd",
              i,
            });
          }
          let minx = 1e9,
            miny = 1e9,
            maxx = -1e9,
            maxy = -1e9,
            len = 0;
          for (const p of pts) {
            minx = Math.min(minx, p.x);
            miny = Math.min(miny, p.y);
            maxx = Math.max(maxx, p.x);
            maxy = Math.max(maxy, p.y);
          }
          for (let i = 0; i < n; i++) {
            const a = pts[i],
              b = pts[(i + 1) % n];
            len += Math.hypot(b.x - a.x, b.y - a.y);
          }
          const tanAngle = tan.map((t) => Math.atan2(t.y, t.x));
          // curvature radius and which side the inside of the bend lies on
          const cstep = Math.max(1, Math.round(45 / (peri / n)));
          const R = new Float32Array(n),
            SGN = new Float32Array(n);
          for (let i = 0; i < n; i++) {
            const a = pts[(i - cstep + n) % n],
              b = pts[i],
              c = pts[(i + cstep) % n];
            const A = Math.hypot(b.x - a.x, b.y - a.y),
              B = Math.hypot(c.x - b.x, c.y - b.y),
              C = Math.hypot(c.x - a.x, c.y - a.y);
            const ar = (b.x - a.x) * (c.y - a.y) - (c.x - a.x) * (b.y - a.y);
            R[i] =
              Math.abs(ar) > 1
                ? Math.min(4000, (A * B * C) / (2 * Math.abs(ar)))
                : 4000;
            const t1 = tan[i],
              t2 = tan[(i + cstep) % n];
            SGN[i] =
              Math.sign((t2.x - t1.x) * nrm[i].x + (t2.y - t1.y) * nrm[i].y) ||
              0;
          }
          return {
            name: def.name,
            desc: def.desc,
            harbour: !!def.harbour,
            fleet: def.fleet || 0,
            pts,
            tan,
            nrm,
            n,
            width: def.width,
            half,
            buoys,
            tanAngle,
            R,
            SGN,
            len,
            spacing: len / n,
            bounds: {
              minx: minx - half,
              miny: miny - half,
              maxx: maxx + half,
              maxy: maxy + half,
            },
          };
        }

        const TRACKS = COURSES.map(buildTrack);

        /* ============================================================
   COURSE RECORDS — best lap plus best totals per lap count.
   ============================================================ */
        const REC_KEY = "tiderunner.records.v2";
        const LEGACY_REC_KEY = "tiderunner.records.v1";
        let records = {};
        (function loadRecords() {
          try {
            const raw = localStorage.getItem(REC_KEY);
            const parsed = raw ? JSON.parse(raw) : null;
            if (parsed && typeof parsed === "object") {
              records = parsed;
              return;
            }
          } catch (e) {}
          try {
            const raw = localStorage.getItem(LEGACY_REC_KEY);
            const legacy = raw ? JSON.parse(raw) : null;
            if (legacy && typeof legacy === "object") {
              for (const k of Object.keys(legacy)) {
                if (typeof legacy[k] === "number")
                  records[k] = { lap: legacy[k], totals: {} };
              }
              try {
                localStorage.setItem(REC_KEY, JSON.stringify(records));
              } catch (e) {}
            }
          } catch (e) {}
        })();
        function saveRecords() {
          try {
            localStorage.setItem(REC_KEY, JSON.stringify(records));
          } catch (e) {}
        }
        function ensureRec(name) {
          const r = records[name];
          if (!r || typeof r !== "object" || Array.isArray(r))
            records[name] = { lap: 0, totals: {} };
          if (typeof records[name].lap !== "number") records[name].lap = 0;
          if (!records[name].totals || typeof records[name].totals !== "object")
            records[name].totals = {};
          return records[name];
        }
        function bestLapFor(name) {
          const r = records[name];
          return r && typeof r.lap === "number" ? r.lap : 0;
        }
        function bestTotalFor(name, laps) {
          const r = records[name];
          return r && r.totals && typeof r.totals[laps] === "number"
            ? r.totals[laps]
            : 0;
        }
        function setLapRecord(name, t) {
          const r = ensureRec(name);
          if (!(t > 0) || (r.lap && t >= r.lap)) return false;
          r.lap = t;
          saveRecords();
          return true;
        }
        function setTotalRecord(name, laps, t) {
          const r = ensureRec(name);
          const cur = r.totals[laps];
          if (!(t > 0) || (cur && t >= cur)) return false;
          r.totals[laps] = t;
          saveRecords();
          return true;
        }

        /* ============================================================
   CANVAS / VIEW
   ============================================================ */
        const cv = document.getElementById("game");
        const ctx = cv.getContext("2d");
        let W = 0,
          H = 0,
          DPR = 1;
        function resize() {
          DPR = Math.min(window.devicePixelRatio || 1, 2);
          W = window.innerWidth;
          H = window.innerHeight;
          cv.width = Math.round(W * DPR);
          cv.height = Math.round(H * DPR);
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        }
        addEventListener("resize", resize);
        resize();

        const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

        /* water texture tile for the shallows */
        function shoalTile() {
          const c = document.createElement("canvas");
          c.width = c.height = 200;
          const g = c.getContext("2d");
          g.fillStyle = "#157f86";
          g.fillRect(0, 0, 200, 200);
          const dash = (x, y, w, col, a) => {
            g.strokeStyle = col;
            g.globalAlpha = a;
            g.lineWidth = 1.6;
            g.lineCap = "round";
            g.beginPath();
            g.moveTo(x, y);
            g.lineTo(x + w, y + 1.5);
            g.stroke();
            g.beginPath();
            g.moveTo(x - 200, y);
            g.lineTo(x - 200 + w, y + 1.5);
            g.stroke();
            g.beginPath();
            g.moveTo(x, y - 200);
            g.lineTo(x + w, y - 200 + 1.5);
            g.stroke();
          };
          for (let i = 0; i < 150; i++)
            dash(
              Math.random() * 200,
              Math.random() * 200,
              6 + Math.random() * 16,
              "#2fb0b0",
              0.16 + Math.random() * 0.2,
            );
          for (let i = 0; i < 45; i++)
            dash(
              Math.random() * 200,
              Math.random() * 200,
              4 + Math.random() * 10,
              "#c9b48a",
              0.06 + Math.random() * 0.08,
            );
          g.globalAlpha = 1;
          return c;
        }
        const shoalPat = ctx.createPattern(shoalTile(), "repeat");

        /* ============================================================
   STATE
   ============================================================ */
        const S = {
          menu: "menu",
          count: "count",
          race: "race",
          done: "done",
          pause: "pause",
        };
        let state = S.menu,
          pausedFrom = null;
        let track = TRACKS[0],
          courseIdx = 0,
          totalLaps = 3,
          skill = 1;
        let boats = [],
          me = null,
          cam = { x: 0, y: 0, s: 1 },
          raceT = 0,
          countT = 0,
          wake = [],
          trail = [],
          trailAcc = 0;
        let newLapRecord = false,
          newTotalRecord = false;
        function playerName() {
          const raw = (SETTINGS && SETTINGS.name) || "";
          const trimmed = raw.trim();
          return trimmed || "You";
        }

        /* The first three turn out for an ordinary four-boat race; a course with a
   fleet size takes as many as it needs. Hull colours are picked to stay apart
   from each other, from your amber, and from the red and green of the marks. */
        const RIVALS = [
          { name: "Sea Fret", col: "#f2f0ea", trim: "#9fb4b8" },
          { name: "Bramble", col: "#8a8ff5", trim: "#5b60c9" },
          { name: "Mad Mackerel", col: "#ff8a3d", trim: "#c85f1e" },
          { name: "Tern", col: "#ff5f9e", trim: "#c93a72" },
          { name: "Kittiwake", col: "#9fd8ff", trim: "#5f9fc9" },
          { name: "Peat", col: "#c69a6d", trim: "#94714a" },
          { name: "Sorrel", col: "#b6e04a", trim: "#7fa32e" },
          { name: "Nightjar", col: "#c86bff", trim: "#9440c9" },
          { name: "Pewter", col: "#7f95a8", trim: "#566a7a" },
          { name: "Damson", col: "#9e3b52", trim: "#6f2438" },
          { name: "Halyard", col: "#4a90d9", trim: "#2f66a3" },
        ];
        /* Difficulty is skill, not just horsepower:
   safety  — how much of the theoretical corner speed they'll use
   apex    — how much of the river they use to straighten a bend
   noise   — wandering off their own line
   react   — how quickly they move the helm
   boostIQ — whether they check there's clear water before taking a boost
             (you can't brake out of a boost, so grabbing one before a
              bend is exactly how a bad driver ends up in the sand)
   draft   — whether they'll tuck into the wake ahead to be towed along
   pass    — whether they'll pull out of that wake and make the move
   Each tier corners closer to the limit and holds a steadier line than the
   one below. Engine size is the last resort, because it is the one thing
   you cannot answer: your own boat settles at about 231px/s, or 257 sitting
   in someone's wake, and a rival geared past that simply drives away down
   every straight however well you take the bends. Insane is set just above
   what a drafting boat can hold — roughly 276px/s — so it is quick enough
   to have to be chased, and slow enough to be caught in the corners, on the
   boosts, and in traffic. Winding it much higher stops being difficult and
   starts being unbeatable. */
        const TIERS = [
          {
            name: "Easy",
            power: 0.78,
            safety: 0.74,
            apex: 0.07,
            noise: 0.22,
            react: 5.2,
            boostIQ: 0.1,
            draft: 0,
            pass: 0,
          },
          {
            name: "Normal",
            power: 1.04,
            safety: 1.02,
            apex: 0.18,
            noise: 0.08,
            react: 10.0,
            boostIQ: 0.55,
            draft: 0.35,
            pass: 0.25,
          },
          {
            name: "Hard",
            power: 1.18,
            safety: 1.19,
            apex: 0.24,
            noise: 0.035,
            react: 14.0,
            boostIQ: 0.85,
            draft: 0.7,
            pass: 0.55,
          },
          {
            name: "Insane",
            power: 1.24,
            safety: 1.28,
            apex: 0.3,
            noise: 0.015,
            react: 18.0,
            boostIQ: 1.0,
            draft: 1.0,
            pass: 0.9,
          },
        ];
        const OMEGA = 1.25,
          DECEL = 250,
          LANE_MAX = 0.5;
        const tightness = (r) =>
          r >= 1100 ? 0 : Math.min(1, (1100 - r) / 800);

        function makeBoat(o) {
          return Object.assign(
            {
              x: 0,
              y: 0,
              h: 0,
              vx: 0,
              vy: 0,
              idx: 0,
              prevIdx: 0,
              lap: 0,
              off: 0,
              done: false,
              boost: 0,
              offTime: 0,
              hunter: null,
              eaten: 0,
              chomped: 0,
              lapStart: 0,
              lastLap: 0,
              bestLap: 0,
              total: 0,
              shallow: false,
              drafting: false,
              bump: 0,
              spawnT: 0,
              bumpSfxT: 0,
            },
            o,
          );
        }

        function startRace() {
          track = TRACKS[courseIdx];
          const n = track.n;
          boats = [];
          // a course can call for a bigger fleet; a wide one starts three abreast
          const fleet = Math.max(
            2,
            Math.min(track.fleet || 4, RIVALS.length + 1),
          );
          const perRow = fleet > 4 ? 3 : 2;
          const spread = perRow === 3 ? 0.42 : 0.3;
          // rivals occupy the front of the grid; you start at the back
          const order = RIVALS.slice(0, fleet - 1).concat([null]);
          order.forEach((r, k) => {
            const row = Math.floor(k / perRow),
              slot = k % perRow;
            const col = perRow === 3 ? slot - 1 : slot ? 1 : -1;
            const i =
              (n - Math.round((120 + row * 115) / track.spacing) + n * 2) % n;
            const p = track.pts[i],
              t = track.tan[i],
              nv = track.nrm[i];
            const off = col * track.half * spread;
            const T = TIERS[skill];
            const b = makeBoat({
              x: p.x + nv.x * off,
              y: p.y + nv.y * off,
              h: Math.atan2(t.y, t.x),
              idx: i,
              prevIdx: i,
              lap: -1, // sat behind the line; crossing it starts lap 1
              ai: r !== null,
              name: r ? r.name : playerName(),
              col: r ? r.col : "#ffd84a",
              trim: r ? r.trim : "#c99a12",
              power: r ? T.power * (1 - k * 0.012) : 1, // slight spread across the field
              tier: T,
              steerCmd: 0,
              lane: 0,
              noise: 0,
              noiseT: 0,
            });
            boats.push(b);
          });
          me = boats[boats.length - 1]; // you are the last one off the grid
          wake.length = 0;
          trail.length = 0;
          spawnFauna();
          spawnBoosts();
          spawnMoored();
          raceT = 0;
          countT = 3.999;
          newLapRecord = false;
          newTotalRecord = false;
          cam.x = me.x;
          cam.y = me.y;
          state = S.count;
          hud.classList.add("on");
          document.body.classList.add("racing");
          touch.classList.toggle("on", isTouch);
          menuEl.classList.add("hidden");
          resultsEl.classList.add("hidden");
        }

        /* ============================================================
   INPUT
   ============================================================ */
        const keys = {};
        const isTouch =
          matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
        addEventListener("keydown", (e) => {
          if (
            ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(
              e.key,
            )
          )
            e.preventDefault();
          keys[e.key.toLowerCase()] = true;
          if (e.key.toLowerCase() === "r" && state !== S.menu) startRace();
          if (e.key === "Escape" || e.key.toLowerCase() === "p") {
            if (state === S.race || state === S.count) pauseGame();
            else if (state === S.pause) resumeGame();
          }
        });
        addEventListener("keyup", (e) => {
          keys[e.key.toLowerCase()] = false;
        });

        const touch = document.getElementById("touch");
        const T = { steer: 0, thr: 0 };

        // A single radial stick controls helm (x) and signed throttle (y).
        (() => {
          const joy = document.getElementById("pJ"),
            thumb = document.getElementById("pJt");
          let active = null,
            originX = 0,
            originY = 0;
          const move = (e) => {
            const radius = joy.offsetWidth * 0.29;
            let dx = e.clientX - originX;
            let dy = e.clientY - originY;
            const distance = Math.hypot(dx, dy);
            if (distance > radius) {
              dx *= radius / distance;
              dy *= radius / distance;
            }
            const deadzone = 0.1;
            const axis = (value) => {
              const raw = value / radius;
              return Math.abs(raw) < deadzone
                ? 0
                : (Math.sign(raw) * (Math.abs(raw) - deadzone)) /
                    (1 - deadzone);
            };
            // Push in the direction the boat is heading = forward; sideways = steer.
            const h = me ? me.h : 0;
            const cs = Math.cos(h),
              sn = Math.sin(h);
            const fwd = dx * cs + dy * sn;
            const right = -dx * sn + dy * cs;
            T.thr = axis(fwd);
            T.steer = axis(right);
            thumb.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
          };
          touch.addEventListener("pointerdown", (e) => {
            if (active !== null || (state !== S.count && state !== S.race))
              return;
            e.preventDefault();
            active = e.pointerId;
            originX = e.clientX;
            originY = e.clientY;
            const size = joy.offsetWidth;
            const margin = size / 2 + 12;
            const x = Math.max(margin, Math.min(innerWidth - margin, originX));
            const y = Math.max(margin, Math.min(innerHeight - margin, originY));
            joy.style.left = `${x}px`;
            joy.style.top = `${y}px`;
            touch.setPointerCapture(e.pointerId);
            joy.classList.add("act");
          });
          touch.addEventListener("pointermove", (e) => {
            if (e.pointerId === active) move(e);
          });
          const release = (e) => {
            if (e.pointerId !== active) return;
            active = null;
            T.steer = 0;
            T.thr = 0;
            thumb.style.transform = "translate(-50%,-50%)";
            joy.classList.remove("act");
          };
          touch.addEventListener("pointerup", release);
          touch.addEventListener("pointercancel", release);
        })();

        function controls() {
          const kb =
            (keys["a"] || keys["arrowleft"] ? -1 : 0) +
            (keys["d"] || keys["arrowright"] ? 1 : 0);
          const steer = Math.max(-1, Math.min(1, T.steer + kb));
          const keyThr =
            (keys["w"] || keys["arrowup"] ? 1 : 0) -
            (keys["s"] || keys["arrowdown"] ? 1 : 0);
          const thr = keyThr || T.thr;
          return { steer, thr };
        }

        const boot = document.getElementById("boot");
        setTimeout(() => {
          boot.classList.add("done");
          setTimeout(() => boot.remove(), 600);
        }, 2300);

        /* ============================================================
   SOUND — Web Audio generated procedurally, no assets.
   ============================================================ */
        let AC = null,
          AUD = null;
        let musicBar = 0,
          musicNext = 0;

        // Persisted audio + player preferences.
        const SETTINGS = { music: true, sfx: true, name: "" };
        try {
          const saved = JSON.parse(localStorage.getItem("tr-settings") || "{}");
          if (typeof saved.music === "boolean") SETTINGS.music = saved.music;
          if (typeof saved.sfx === "boolean") SETTINGS.sfx = saved.sfx;
          if (typeof saved.name === "string")
            SETTINGS.name = saved.name.slice(0, 18);
        } catch (e) {}
        function saveSettings() {
          try {
            localStorage.setItem("tr-settings", JSON.stringify(SETTINGS));
          } catch (e) {}
        }

        // A four-bar loop, one chord per bar: C — Am — F — G (I-vi-IV-V).
        // Each entry = [bass_freq, [arp_freqs across the bar]].
        const musicSeq = [
          [130.81, [261.63, 329.63, 392.0, 329.63]], // C:  C3 / C4 E4 G4 E4
          [110.0, [220.0, 261.63, 329.63, 261.63]], // Am: A2 / A3 C4 E4 C4
          [174.61, [349.23, 440.0, 523.25, 440.0]], // F:  F3 / F4 A4 C5 A4
          [196.0, [392.0, 493.88, 587.33, 493.88]], // G:  G3 / G4 B4 D5 B4
        ];

        function initAudio() {
          if (AC) return;
          try {
            AC = new (window.AudioContext || window.webkitAudioContext)();
          } catch (e) {
            return;
          }
          const master = AC.createGain();
          master.gain.value = 0.55;
          master.connect(AC.destination);

          // ---- Engine: soft sub-sine + gentle triangle harmonic through a lowpass,
          //      plus a filtered pink-noise "water rush" that swells with speed. ----
          const sub = AC.createOscillator();
          sub.type = "sine";
          sub.frequency.value = 42;
          const hum = AC.createOscillator();
          hum.type = "triangle";
          hum.frequency.value = 126;

          const lfo = AC.createOscillator();
          lfo.type = "sine";
          lfo.frequency.value = 2.6;
          const lfoGain = AC.createGain();
          lfoGain.gain.value = 16;
          lfo.connect(lfoGain);

          const filt = AC.createBiquadFilter();
          filt.type = "lowpass";
          filt.frequency.value = 240;
          filt.Q.value = 0.8;
          lfoGain.connect(filt.frequency);

          const nLen = (AC.sampleRate * 2) | 0;
          const nBuf = AC.createBuffer(1, nLen, AC.sampleRate);
          const nd = nBuf.getChannelData(0);
          let a0 = 0,
            a1 = 0,
            a2 = 0;
          for (let i = 0; i < nLen; i++) {
            const w = Math.random() * 2 - 1;
            a0 = 0.997 * a0 + 0.029 * w;
            a1 = 0.985 * a1 + 0.032 * w;
            a2 = 0.95 * a2 + 0.048 * w;
            nd[i] = (a0 + a1 + a2) * 0.4;
          }
          const noise = AC.createBufferSource();
          noise.buffer = nBuf;
          noise.loop = true;
          const nFilt = AC.createBiquadFilter();
          nFilt.type = "bandpass";
          nFilt.frequency.value = 600;
          nFilt.Q.value = 0.5;
          const nGain = AC.createGain();
          nGain.gain.value = 0;
          noise.connect(nFilt).connect(nGain);

          const g = AC.createGain();
          g.gain.value = 0;
          sub.connect(filt);
          hum.connect(filt);
          filt.connect(g);

          // ---- SFX bus so game sounds can be muted independently of music. ----
          const sfxGain = AC.createGain();
          sfxGain.gain.value = SETTINGS.sfx ? 1 : 0;
          sfxGain.connect(master);
          g.connect(sfxGain);
          nGain.connect(sfxGain);
          sub.start();
          hum.start();
          lfo.start();
          noise.start();

          // ---- Music bus ----
          const musicGain = AC.createGain();
          musicGain.gain.value = 0;
          musicGain.connect(master);

          AUD = {
            master,
            musicGain,
            sfxGain,
            engine: { sub, hum, lfo, lfoGain, filt, g, nFilt, nGain },
            lastBeep: 99,
            musicOn: false,
            sfxOn: SETTINGS.sfx,
          };
        }

        function stepAudio() {
          if (!AUD || !me) return;
          if (AC.state === "suspended") AC.resume();
          const e = AUD.engine,
            t = AC.currentTime,
            tc = 0.08;
          const spd = Math.hypot(me.vx, me.vy);
          const boosted = me.boost > 0,
            eaten = me.eaten > 0;
          const running = state === S.race || state === S.count;
          const thr = running
            ? Math.min(1, spd / TOP + (boosted ? 0.15 : 0))
            : 0;

          e.sub.frequency.setTargetAtTime(38 + thr * 24, t, tc);
          e.hum.frequency.setTargetAtTime(114 + thr * 72, t, tc);
          e.filt.frequency.setTargetAtTime(
            200 + thr * 520 + (boosted ? 200 : 0),
            t,
            tc,
          );
          e.lfoGain.gain.setTargetAtTime(12 + thr * 22, t, tc);
          e.lfo.frequency.setTargetAtTime(2.4 + thr * 4, t, tc);
          e.nFilt.frequency.setTargetAtTime(360 + thr * 1000, t, tc);
          e.nGain.gain.setTargetAtTime(
            state === S.race && !eaten ? thr * 0.025 : 0,
            t,
            tc,
          );
          const vol =
            state === S.race && !eaten
              ? 0.016 + thr * 0.05
              : state === S.count
                ? 0.02
                : 0;
          e.g.gain.setTargetAtTime(vol, t, 0.22);

          if (AUD.sfxOn !== SETTINGS.sfx) {
            AUD.sfxGain.gain.setTargetAtTime(SETTINGS.sfx ? 1 : 0, t, 0.06);
            AUD.sfxOn = SETTINGS.sfx;
          }

          if (state === S.count) {
            const v = Math.ceil(countT - 1);
            if (v >= 0 && v < AUD.lastBeep) {
              sfxBeep(v === 0);
              AUD.lastBeep = v;
            }
          } else AUD.lastBeep = 99;

          updateMusic();
        }

        function startMusic() {
          if (!AUD || AUD.musicOn) return;
          AUD.musicOn = true;
          musicBar = 0;
          musicNext = AC.currentTime + 0.15;
        }

        function updateMusic() {
          if (!AUD) return;
          const t = AC.currentTime;
          const inLobby =
            state === S.menu || state === S.done || state === S.pause;
          const wantOn = AUD.musicOn && SETTINGS.music;
          const target = wantOn ? (inLobby ? 0.3 : 0.05) : 0;
          AUD.musicGain.gain.setTargetAtTime(target, t, 0.6);
          if (!wantOn) return;
          const bpm = 132,
            beat = 60 / bpm,
            bar = beat * 4;
          while (musicNext < t + 0.3) {
            scheduleBar(musicNext, musicBar);
            musicNext += bar;
            musicBar++;
          }
        }

        function scheduleBar(at, index) {
          const [bass, arp] = musicSeq[index % musicSeq.length];
          const beat = 60 / 132;
          musicNote(bass, at, beat * 0.9, 0.32, "triangle");
          musicNote(bass, at + beat * 2, beat * 0.9, 0.32, "triangle");
          for (let i = 0; i < 8; i++) {
            const f = arp[i % arp.length];
            musicNote(f, at + (i * beat) / 2, beat * 0.42, 0.11, "square");
          }
          musicKick(at);
          musicKick(at + beat * 2);
          for (let i = 0; i < 8; i++) musicHat(at + (i * beat) / 2 + beat / 4);
        }

        function musicNote(freq, at, dur, vol, type) {
          const o = AC.createOscillator();
          o.type = type || "square";
          o.frequency.value = freq;
          const g = AC.createGain();
          g.gain.setValueAtTime(0, at);
          g.gain.linearRampToValueAtTime(vol, at + 0.005);
          g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
          o.connect(g).connect(AUD.musicGain);
          o.start(at);
          o.stop(at + dur + 0.02);
        }
        function musicKick(at) {
          const o = AC.createOscillator();
          o.type = "sine";
          o.frequency.setValueAtTime(140, at);
          o.frequency.exponentialRampToValueAtTime(50, at + 0.1);
          const g = AC.createGain();
          g.gain.setValueAtTime(0.35, at);
          g.gain.exponentialRampToValueAtTime(0.0001, at + 0.15);
          o.connect(g).connect(AUD.musicGain);
          o.start(at);
          o.stop(at + 0.2);
        }
        function musicHat(at) {
          const len = 0.04;
          const buf = AC.createBuffer(
            1,
            (AC.sampleRate * len) | 0,
            AC.sampleRate,
          );
          const d = buf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
          const src = AC.createBufferSource();
          src.buffer = buf;
          const filt = AC.createBiquadFilter();
          filt.type = "highpass";
          filt.frequency.value = 6000;
          const g = AC.createGain();
          g.gain.setValueAtTime(0.1, at);
          g.gain.exponentialRampToValueAtTime(0.0001, at + len);
          src.connect(filt).connect(g).connect(AUD.musicGain);
          src.start(at);
        }

        function sfxNoise(f0, f1, dur, vol) {
          if (!AC || !SETTINGS.sfx) return;
          const t = AC.currentTime;
          const len = Math.max(1, (AC.sampleRate * dur) | 0);
          const buf = AC.createBuffer(1, len, AC.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < len; i++)
            d[i] = (Math.random() * 2 - 1) * (1 - i / len);
          const src = AC.createBufferSource();
          src.buffer = buf;
          const filt = AC.createBiquadFilter();
          filt.type = "lowpass";
          filt.frequency.setValueAtTime(f0, t);
          filt.frequency.exponentialRampToValueAtTime(
            Math.max(40, f1),
            t + dur,
          );
          const g = AC.createGain();
          g.gain.setValueAtTime(vol, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          src.connect(filt).connect(g).connect(AUD.sfxGain);
          src.start();
        }
        function sfxTone(freq, dur, vol, type) {
          if (!AC || !SETTINGS.sfx) return;
          const t = AC.currentTime;
          const o = AC.createOscillator();
          o.type = type || "square";
          o.frequency.value = freq;
          const g = AC.createGain();
          g.gain.setValueAtTime(vol, t);
          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
          o.connect(g).connect(AUD.sfxGain);
          o.start();
          o.stop(t + dur + 0.02);
        }
        function sfxBump(intensity) {
          const k = Math.max(0.2, Math.min(1, intensity || 0.4));
          sfxNoise(700 + 400 * k, 70, 0.22 + 0.08 * k, 0.16 + 0.18 * k);
        }
        function sfxBoost() {
          sfxTone(320, 0.15, 0.2, "triangle");
          setTimeout(() => sfxTone(520, 0.12, 0.16, "triangle"), 90);
        }
        function sfxSharkAlert() {
          sfxTone(140, 0.6, 0.16, "sawtooth");
        }
        function sfxChomp() {
          sfxNoise(320, 60, 0.35, 0.42);
          setTimeout(() => sfxNoise(240, 55, 0.4, 0.38), 140);
          setTimeout(() => sfxNoise(200, 45, 0.5, 0.32), 300);
          sfxTone(88, 0.7, 0.15, "sawtooth");
        }
        function sfxBeep(hi) {
          sfxTone(hi ? 880 : 540, 0.13, 0.22, "square");
        }

        // Kick off audio + lobby music on the very first tap anywhere.
        document.addEventListener(
          "pointerdown",
          () => {
            initAudio();
            startMusic();
          },
          { once: true },
        );

        /* ============================================================
   PHYSICS
   ============================================================ */
        const ACC = 340,
          REV = 150,
          TURN = 2.55,
          TOP = 225,
          CUR = 20;
        const BOOST_ACC = 170; // extra thrust while boosting
        const HUNT_AT = 2.2; // seconds aground before a shark takes interest
        const EAT_AT = 5.5; // hard backstop if the shark can't reach you

        function nearestIdx(b) {
          const n = track.n,
            pts = track.pts;
          let best = b.idx,
            bd = Infinity;
          for (let k = -10; k <= 10; k++) {
            const i = (((b.idx + k) % n) + n) % n,
              p = pts[i];
            const d = (p.x - b.x) ** 2 + (p.y - b.y) ** 2;
            if (d < bd) {
              bd = d;
              best = i;
            }
          }
          return { i: best, d: Math.sqrt(bd) };
        }

        function stepBoat(b, dt, ctl) {
          // helm
          const fwd = b.vx * Math.cos(b.h) + b.vy * Math.sin(b.h);
          const flow = Math.min(1, Math.abs(fwd) / 55);
          b.h += ctl.steer * TURN * flow * (fwd < 0 ? -1 : 1) * dt;

          // thrust along the hull
          let push =
            ctl.thr > 0
              ? ACC * b.power * (b.shallow ? 0.6 : 1) * (b.drafting ? 1.14 : 1)
              : ctl.thr < 0
                ? -REV
                : 0;
          if (b.boost > 0) {
            push += BOOST_ACC;
            b.boost -= dt;
          }
          b.vx += Math.cos(b.h) * push * dt;
          b.vy += Math.sin(b.h) * push * dt;

          // the river runs: a steady push downstream while you're in the channel
          if (!b.shallow) {
            const t = track.tan[b.idx];
            b.vx += t.x * CUR * dt;
            b.vy += t.y * CUR * dt;
          }

          // split into forward / lateral, drag each differently → drift
          const cx = Math.cos(b.h),
            cy = Math.sin(b.h);
          let f = b.vx * cx + b.vy * cy;
          let l = -b.vx * cy + b.vy * cx;
          const extra = b.shallow ? 1.7 : 0;
          f -= (f * (1.1 + extra) + 0.0016 * f * Math.abs(f)) * dt;
          l -= l * (4.6 + extra) * dt;
          b.vx = f * cx - l * cy;
          b.vy = f * cy + l * cx;
          b.drift = Math.abs(l);

          b.x += b.vx * dt;
          b.y += b.vy * dt;

          // course position
          const nr = nearestIdx(b);
          b.prevIdx = b.idx;
          b.idx = nr.i;
          b.shallow = nr.d > track.half;
          b.off = nr.d;

          // how long have we been off the river? the sharks are counting
          if (state === S.race && b.shallow && !b.done) b.offTime += dt;
          else b.offTime = 0;

          // boost pickups
          for (const bo of boosts) {
            if (bo.cool > 0) {
              bo.cool -= dt;
              continue;
            }
            if ((b.x - bo.x) ** 2 + (b.y - bo.y) ** 2 < 26 * 26) {
              bo.cool = 6;
              b.boost = 2.2;
              b.vx += Math.cos(b.h) * 45;
              b.vy += Math.sin(b.h) * 45;
              if (b === me) sfxBoost();
              if (!REDUCED)
                for (let i = 0; i < 7; i++) spray(b.x, b.y, "#ffd84a", 1.5);
            }
          }

          // lap crossing
          const n = track.n,
            q = n * 0.28;
          if (b.prevIdx > n - q && b.idx < q) {
            b.lap++;
            if (state === S.race) {
              // lap 0 is the crossing of the start line itself — nothing completed yet
              if (b.lap >= 1) {
                const lt = raceT - b.lapStart;
                b.lastLap = lt;
                if (!b.bestLap || lt < b.bestLap) b.bestLap = lt;
                if (b === me && setLapRecord(track.name, lt))
                  newLapRecord = true;
              }
              b.lapStart = raceT;
              if (b.lap >= totalLaps && !b.done) {
                b.done = true;
                b.total = raceT;
                if (b === me && setTotalRecord(track.name, totalLaps, b.total))
                  newTotalRecord = true;
              }
            }
          } else if (b.prevIdx < q && b.idx > n - q) {
            b.lap--;
          }

          // buoy contact
          for (const by of track.buoys) {
            const dx = b.x - by.x,
              dy = b.y - by.y,
              d = Math.hypot(dx, dy);
            if (d < 22) {
              const ux = dx / (d || 1),
                uy = dy / (d || 1);
              b.x = by.x + ux * 22;
              b.y = by.y + uy * 22;
              const dot = b.vx * ux + b.vy * uy;
              // impact speed toward the buoy (positive when actually driving into it)
              const impact = Math.max(0, -dot);
              b.vx -= 1.5 * dot * ux;
              b.vy -= 1.5 * dot * uy;
              b.vx *= 0.62;
              b.vy *= 0.62;
              b.bump = 0.35;
              if (b === me && b.bumpSfxT <= 0 && impact > 22) {
                sfxBump(Math.min(1, impact / 140));
                b.bumpSfxT = 0.5;
              }
              if (!REDUCED)
                for (let i = 0; i < 5; i++) spray(b.x, b.y, "#eaf7f4", 1.4);
            }
          }
          if (b.bump > 0) b.bump -= dt;
          if (b.bumpSfxT > 0) b.bumpSfxT -= dt;
        }

        function autopilot(b, dt) {
          const n = track.n,
            T = b.tier,
            sp = track.spacing;
          const spd = Math.hypot(b.vx, b.vy);

          // ---- speed: scan ahead and respect the braking distance to the tightest bend ----
          let vT = TOP * b.power,
            d = 0;
          const win = Math.round(620 / sp);
          for (let k = 1; k <= win; k++) {
            const i = (b.idx + k) % n;
            d += sp;
            const vc = Math.min(TOP * b.power, OMEGA * track.R[i] * T.safety);
            const allow = Math.sqrt(vc * vc + 2 * DECEL * d);
            if (allow < vT) vT = allow;
          }
          vT = Math.min(
            vT,
            Math.min(TOP * b.power, OMEGA * track.R[b.idx] * T.safety),
          );

          // ---- pick a lane: inside of the bend, averaged so alternating meanders
          //      don't make the helm flip from side to side ----
          b.noiseT -= dt;
          if (b.noiseT <= 0) {
            b.noiseT = 1.4 + Math.random() * 2.4;
            b.noise = (Math.random() * 2 - 1) * T.noise;
          }
          const wide = b.off > track.half * 0.74;
          const look = Math.max(2, Math.round(90 / sp));
          let lane = 0;
          if (!wide) {
            let acc = 0,
              w = 0;
            for (let k = look; k < look + Math.round(240 / sp); k++) {
              const i = (b.idx + k) % n;
              acc += track.SGN[i] * tightness(track.R[i]);
              w++;
            }
            lane = (w ? acc / w : 0) * T.apex + b.noise;
            const clear = vT > TOP * b.power * 0.8;
            for (const bo of boosts) {
              if (bo.cool > 0) continue;
              let g = bo.i - b.idx;
              if (g < 0) g += n;
              const gap = g * sp;
              if (gap <= 40 || gap >= 430) continue;
              if (Math.abs(bo.lane - lane) > 0.75) continue;
              if (clear || Math.random() > T.boostIQ) {
                lane = bo.lane;
                break;
              }
            }
            // ---- racecraft: sit in the wake to be towed up to the boat ahead, then
            //      pull out to the roomier side to make the pass. Lower tiers do
            //      neither and simply queue up behind whatever is in front. ----
            if (T.draft > 0) {
              let gap = 1e9,
                ahead = null;
              for (const o of boats) {
                if (o === b || o.eaten > 0) continue;
                let g = o.idx - b.idx;
                if (g < -n / 2) g += n;
                else if (g > n / 2) g -= n;
                const m = g * sp;
                if (m > 0 && m < 190 && m < gap) {
                  gap = m;
                  ahead = o;
                }
              }
              if (ahead) {
                const op = track.pts[ahead.idx],
                  on = track.nrm[ahead.idx];
                const oLane =
                  ((ahead.x - op.x) * on.x + (ahead.y - op.y) * on.y) /
                  track.half;
                // only commit to the move with clear water ahead and the speed to use
                // it — pulling out of the wake mid-bend just loses the tow and the corner
                const quicker = spd > Math.hypot(ahead.vx, ahead.vy) + 4;
                lane +=
                  gap <= 62 && clear && quicker
                    ? ((oLane > 0 ? -LANE_MAX : LANE_MAX) - lane) * T.pass // out and past
                    : (oLane - lane) *
                      T.draft *
                      (1 - tightness(track.R[b.idx])); // sit in the tow,
                // but only where following costs no apex
              }
            }
            lane = Math.max(-LANE_MAX, Math.min(LANE_MAX, lane));
          }
          b.lane += (lane - b.lane) * Math.min(1, 3.2 * dt);

          // ---- Stanley tracking: heading error plus a cross-track correction.
          //      Chasing a far-off aim point cuts corners; this holds the line. ----
          const cp = track.pts[b.idx],
            cn = track.nrm[b.idx];
          const e =
            (b.x - cp.x) * cn.x + (b.y - cp.y) * cn.y - b.lane * track.half;
          const fi = (b.idx + Math.max(1, Math.round(70 / sp))) % n;
          let head = track.tanAngle[fi] - b.h;
          while (head > Math.PI) head -= 2 * Math.PI;
          while (head < -Math.PI) head += 2 * Math.PI;
          let diff = head + Math.atan2(-2.6 * e, Math.max(spd, 55));

          // ---- stay off the marks ----
          let dodge = 0;
          for (const by of track.buoys) {
            const dx = by.x - b.x,
              dy = by.y - b.y,
              d2 = dx * dx + dy * dy;
            if (d2 > 110 * 110) continue;
            const dd = Math.sqrt(d2);
            const ahead = (dx * Math.cos(b.h) + dy * Math.sin(b.h)) / dd;
            if (ahead < 0.35) continue;
            const side = (-dx * Math.sin(b.h) + dy * Math.cos(b.h)) / dd;
            dodge -= Math.sign(side || 1) * (1 - dd / 110) * ahead * 1.5;
          }

          // ---- helm has weight; better drivers move it faster ----
          const want = Math.max(-1, Math.min(1, diff * 2.2 + dodge));
          b.steerCmd += (want - b.steerCmd) * Math.min(1, T.react * dt);
          const thr = spd > vT * 1.04 ? -1 : spd < vT * 0.98 ? 1 : 0;
          return { steer: b.steerCmd, thr };
        }

        function slipstream() {
          for (const b of boats) {
            b.drafting = false;
            for (const o of boats) {
              if (o === b) continue;
              const dx = o.x - b.x,
                dy = o.y - b.y,
                d = Math.hypot(dx, dy);
              if (d > 28 && d < 130) {
                const ang = Math.abs(Math.atan2(dy, dx) - b.h);
                const a = Math.min(ang, Math.abs(ang - 2 * Math.PI));
                if (a < 0.45 && Math.hypot(b.vx, b.vy) > 60) {
                  b.drafting = true;
                  break;
                }
              }
            }
          }
        }

        function separate() {
          for (let i = 0; i < boats.length; i++)
            for (let j = i + 1; j < boats.length; j++) {
              const a = boats[i],
                b = boats[j];
              const dx = b.x - a.x,
                dy = b.y - a.y,
                d = Math.hypot(dx, dy);
              if (d < 30 && d > 0.01) {
                const push = (30 - d) / 2,
                  ux = dx / d,
                  uy = dy / d;
                a.x -= ux * push;
                a.y -= uy * push;
                b.x += ux * push;
                b.y += uy * push;
                a.vx -= ux * 22;
                a.vy -= uy * 22;
                b.vx += ux * 22;
                b.vy += uy * 22;
              }
            }
        }

        /* ============================================================
   RIVER LIFE — whales, sharks, rays and shoals out on the flats.
   They are scenery: no collision, and they actively steer away from
   the channel so they never sit in the racing line.
   ============================================================ */
        const FAUNA = [];

        // distance from an arbitrary point to the channel centreline (coarse scan)
        function channelDist(x, y) {
          let bd = Infinity,
            bi = 0;
          for (let i = 0; i < track.n; i += 2) {
            const p = track.pts[i];
            const d = (p.x - x) ** 2 + (p.y - y) ** 2;
            if (d < bd) {
              bd = d;
              bi = i;
            }
          }
          return { d: Math.sqrt(bd), i: bi };
        }

        const SPECIES = {
          whale: {
            len: 78,
            spd: 16,
            turn: 0.3,
            col: "#123c4a",
            tint: "#2c6272",
          },
          shark: {
            len: 30,
            spd: 34,
            turn: 0.75,
            col: "#17414d",
            tint: "#39707c",
          },
          ray: {
            len: 34,
            spd: 22,
            turn: 0.55,
            col: "#1a4652",
            tint: "#3d757f",
          },
          shoal: {
            len: 7,
            spd: 30,
            turn: 1.1,
            col: "#255b63",
            tint: "#59969a",
          },
        };

        function makeCreature(type, x, y) {
          const s = SPECIES[type];
          const c = {
            type,
            s,
            x,
            y,
            h: Math.random() * Math.PI * 2,
            spd: s.spd * (0.8 + Math.random() * 0.4),
            wag: Math.random() * 7,
            turn: 0,
            turnT: 0,
            ci: 0,
            depth: Math.random(),
            depthT: Math.random() * 7,
            scatter: 0,
            size: s.len * (0.8 + Math.random() * 0.45),
            jaw: 0,
            feed: 0,
            flee: 0,
            thrash: 0,
          };
          if (type === "shoal") {
            c.fish = [];
            const k = 7 + Math.floor(Math.random() * 7);
            for (let i = 0; i < k; i++)
              c.fish.push({
                ox: (Math.random() * 2 - 1) * 30,
                oy: (Math.random() * 2 - 1) * 22,
                sz: 0.7 + Math.random() * 0.6,
                ph: Math.random() * 7,
              });
          }
          return c;
        }

        function spawnFauna() {
          FAUNA.length = 0;
          const bd = track.bounds,
            pad = 300;
          const add = (type, count) => {
            let made = 0,
              tries = 0;
            while (made < count && tries < count * 80) {
              tries++;
              const x =
                bd.minx - pad + Math.random() * (bd.maxx - bd.minx + pad * 2);
              const y =
                bd.miny - pad + Math.random() * (bd.maxy - bd.miny + pad * 2);
              const ci = channelDist(x, y);
              if (ci.d < track.half + 110) continue; // keep them off the racing line
              const c = makeCreature(type, x, y);
              c.ci = ci.i;
              FAUNA.push(c);
              made++;
            }
          };
          add("whale", 4);
          add("shark", 7);
          add("ray", 6);
          add("shoal", 13);
        }

        function stepFauna(dt) {
          const bd = track.bounds,
            out = 420;

          // --- assign and release hunters ---
          if (state === S.race) {
            for (const b of boats) {
              if (b.eaten > 0 || b.done) {
                if (b.hunter) {
                  b.hunter.hunt = null;
                  b.hunter = null;
                }
                continue;
              }
              if (b.offTime > HUNT_AT && !b.hunter) {
                // nearest shark that isn't already busy
                let best = null,
                  bdst = Infinity;
                for (const c of FAUNA) {
                  if (c.type !== "shark" || c.hunt) continue;
                  const d = (c.x - b.x) ** 2 + (c.y - b.y) ** 2;
                  if (d < bdst) {
                    bdst = d;
                    best = c;
                  }
                }
                if (!best || bdst > 700 * 700) {
                  // none near — one comes up from deeper water
                  const a = Math.random() * Math.PI * 2;
                  best = makeCreature(
                    "shark",
                    b.x + Math.cos(a) * 380,
                    b.y + Math.sin(a) * 380,
                  );
                  best.ci = b.idx;
                  FAUNA.push(best);
                }
                best.hunt = b;
                b.hunter = best;
                if (b === me) sfxSharkAlert();
              }
              if (b.offTime === 0 && b.hunter) {
                b.hunter.hunt = null;
                b.hunter = null;
              }
              // backstop: if the shark somehow can't reach you, it still gets you
              if (b.offTime > EAT_AT && b.hunter) chomp(b);
            }
          }

          for (const c of FAUNA) {
            // ---- hunting overrides everything else ----
            // ---- feeding: clamped onto the boat, thrashing it under ----
            if (c.feed > 0) {
              c.feed -= dt;
              c.jaw = Math.max(0, c.jaw - dt * 3.4); // jaws close over the hull
              c.thrash += dt * 22;
              c.h += Math.sin(c.thrash) * 2.6 * dt;
              c.x += Math.cos(c.h) * c.s.spd * 0.5 * dt;
              c.y += Math.sin(c.h) * c.s.spd * 0.5 * dt;
              c.wag += dt * 20;
              c.depth = 0.06;
              if (!REDUCED && Math.random() < dt * 30)
                wake.push({
                  x: c.x + (Math.random() - 0.5) * 30,
                  y: c.y + (Math.random() - 0.5) * 30,
                  vx: (Math.random() - 0.5) * 70,
                  vy: (Math.random() - 0.5) * 70,
                  r: 2 + Math.random() * 5,
                  life: 0,
                  max: 0.5 + Math.random() * 0.5,
                  col: Math.random() < 0.25 ? "#e8402a" : "#eaf7f4",
                });
              if (c.feed <= 0) {
                c.flee = 3.2;
                c.depth = 0.5;
              }
              continue;
            }
            // ---- sated: slink back off to deep water ----
            if (c.flee > 0) {
              c.flee -= dt;
              c.h += Math.sin(c.wag * 0.3) * 0.4 * dt;
              c.x += Math.cos(c.h) * c.s.spd * 1.5 * dt;
              c.y += Math.sin(c.h) * c.s.spd * 1.5 * dt;
              c.wag += dt * 9;
              c.jaw = 0;
              c.depth = Math.min(0.85, c.depth + dt * 0.35);
              continue;
            }
            if (c.hunt) {
              const b = c.hunt;
              const want = Math.atan2(b.y - c.y, b.x - c.x);
              let diff = want - c.h;
              while (diff > Math.PI) diff -= 2 * Math.PI;
              while (diff < -Math.PI) diff += 2 * Math.PI;
              c.h += Math.max(-3.4, Math.min(3.4, diff * 3.2)) * dt;
              const v = c.s.spd * 4.2;
              c.x += Math.cos(c.h) * v * dt;
              c.y += Math.sin(c.h) * v * dt;
              c.wag += dt * 16;
              c.depth = 0.12; // right at the surface, fin up
              const gap = Math.hypot(c.x - b.x, c.y - b.y);
              c.jaw = Math.min(1, Math.max(0, (150 - gap) / 110)); // mouth opens on the run-in
              if (gap < 30) chomp(b);
              continue;
            }

            // lazy wander
            c.turnT -= dt;
            if (c.turnT <= 0) {
              c.turnT = 1.8 + Math.random() * 3.2;
              c.turn = (Math.random() * 2 - 1) * c.s.turn;
            }
            let steer = c.turn;

            // nearest bit of channel, searched locally from last known index
            let best = c.ci,
              bdst = Infinity;
            for (let k = -30; k <= 30; k += 2) {
              const i = (((c.ci + k) % track.n) + track.n) % track.n,
                p = track.pts[i];
              const d = (p.x - c.x) ** 2 + (p.y - c.y) ** 2;
              if (d < bdst) {
                bdst = d;
                best = i;
              }
            }
            c.ci = best;
            const dist = Math.sqrt(bdst);

            // sheer away from the banks, and from the edge of the world
            let away = null;
            if (dist < track.half + 95) {
              const p = track.pts[c.ci];
              away = Math.atan2(c.y - p.y, c.x - p.x);
            } else if (
              c.x < bd.minx - out ||
              c.x > bd.maxx + out ||
              c.y < bd.miny - out ||
              c.y > bd.maxy + out
            ) {
              away = Math.atan2(
                (bd.miny + bd.maxy) / 2 - c.y,
                (bd.minx + bd.maxx) / 2 - c.x,
              );
            }

            // boats spook the small stuff
            if (c.type === "shoal" || c.type === "ray") {
              for (const b of boats) {
                const dx = c.x - b.x,
                  dy = c.y - b.y,
                  d2 = dx * dx + dy * dy;
                if (d2 < 190 * 190) {
                  away = Math.atan2(dy, dx);
                  c.scatter = 1.4;
                  break;
                }
              }
            }
            if (c.scatter > 0) c.scatter -= dt;

            if (away !== null) {
              let diff = away - c.h;
              while (diff > Math.PI) diff -= 2 * Math.PI;
              while (diff < -Math.PI) diff += 2 * Math.PI;
              steer = Math.max(-2.2, Math.min(2.2, diff * 2.6));
            }

            c.h += steer * dt;
            const v = c.spd * (c.scatter > 0 ? 2.3 : 1);
            c.x += Math.cos(c.h) * v * dt;
            c.y += Math.sin(c.h) * v * dt;
            c.wag +=
              dt *
              (c.type === "whale" ? 2.2 : c.type === "ray" ? 2.6 : 7) *
              (c.scatter > 0 ? 1.8 : 1);

            // whales roll up to breathe
            if (c.type === "whale") {
              c.depthT += dt * 0.16;
              const surf = Math.sin(c.depthT);
              c.depth = 0.5 - surf * 0.5;
              if (surf > 0.985 && Math.random() < dt * 7 && !REDUCED) {
                for (let i = 0; i < 3; i++) {
                  const p = {
                    x: c.x + Math.cos(c.h) * c.size * 0.34,
                    y: c.y + Math.sin(c.h) * c.size * 0.34,
                  };
                  wake.push({
                    x: p.x,
                    y: p.y,
                    vx: (Math.random() - 0.5) * 26,
                    vy: (Math.random() - 0.5) * 26,
                    r: 3 + Math.random() * 4,
                    life: 0,
                    max: 1.1 + Math.random() * 0.6,
                    col: "#eaf7f4",
                  });
                }
              }
            } else {
              c.depthT += dt * 0.4;
              c.depth = 0.45 + Math.sin(c.depthT) * 0.3;
            }
          }
        }

        function drawFish(L, wag, col) {
          // generic body + wagging tail
          const t = Math.sin(wag) * 0.42;
          ctx.fillStyle = col;
          ctx.beginPath();
          ctx.ellipse(0, 0, L * 0.5, L * 0.19, 0, 0, 7);
          ctx.fill();
          ctx.save();
          ctx.translate(-L * 0.44, 0);
          ctx.rotate(t);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(-L * 0.26, -L * 0.2);
          ctx.lineTo(-L * 0.2, 0);
          ctx.lineTo(-L * 0.26, L * 0.2);
          ctx.closePath();
